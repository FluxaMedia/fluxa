name: Platform Verification

on:
  pull_request:
    paths:
      - ".github/workflows/platform.yml"
      - "app/**"
      - "build-logic/**"
      - "core/**"
      - "data/**"
      - "player/**"
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  push:
    branches: [master]
    paths:
      - ".github/workflows/platform.yml"
      - "app/**"
      - "build-logic/**"
      - "core/**"
      - "data/**"
      - "player/**"
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-shared:
    name: Android shared modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FluxaMedia/fluxa-core
          path: fluxa-core
          ref: master

      - name: Link sibling Rust core
        run: ln -sfn "$GITHUB_WORKSPACE/fluxa-core" "$(dirname "$GITHUB_WORKSPACE")/fluxa-core"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Compile Android shared modules
        run: >-
          ./gradlew --no-daemon
          checkKotlinFileSize
          checkSharedUiBoundary
          checkKmpCommonBoundary
          checkSharedPlayerBoundary
          testDebugUnitTest
          lint
          assembleMobileDebug
          assembleTvDebug
          :core:compileDebugKotlinAndroid
          :data:compileDebugKotlinAndroid
          :player:compileDebugKotlinAndroid
          :shared:compileDebugKotlinAndroid
          :app:compileTvDebugKotlin

  release-smoke:
    name: Android release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FluxaMedia/fluxa-core
          path: fluxa-core
          ref: master

      - name: Link sibling Rust core
        run: ln -sfn "$GITHUB_WORKSPACE/fluxa-core" "$(dirname "$GITHUB_WORKSPACE")/fluxa-core"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Assemble mobile release
        run: ./gradlew --no-daemon :app:assembleMobileRelease

  instrumentation:
    name: Android instrumentation
    needs: android-shared
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FluxaMedia/fluxa-core
          path: fluxa-core
          ref: master

      - name: Link sibling Rust core
        run: ln -sfn "$GITHUB_WORKSPACE/fluxa-core" "$(dirname "$GITHUB_WORKSPACE")/fluxa-core"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Run mobile instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew --no-daemon :app:connectedMobileDebugAndroidTest
