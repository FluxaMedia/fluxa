name: Player Kit

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/player-kit.yml"
      - "apps/apple/FluxaPlayerKit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avfoundation:
    name: AVFoundation engine
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build for macOS
        working-directory: apps/apple/FluxaPlayerKit
        run: swift build -v

      - name: Test package
        working-directory: apps/apple/FluxaPlayerKit
        run: swift test -v

      - name: Build for iOS
        working-directory: apps/apple/FluxaPlayerKit
        run: >-
          xcodebuild
          -scheme FluxaPlayerKit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build for tvOS
        working-directory: apps/apple/FluxaPlayerKit
        run: >-
          xcodebuild
          -scheme FluxaPlayerKit
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
