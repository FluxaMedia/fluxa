name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core/fluxa-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo test --workspace --all-targets
      - run: cargo test --doc

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: >-
          cargo clippy --workspace --all-targets --
          -D warnings
          -A dead_code
          -A clippy::indexing_slicing
          -A clippy::type_complexity
          -A clippy::too_many_arguments
          -A clippy::unwrap_used
          -A clippy::expect_used
          -A clippy::module_inception
          -A clippy::should_implement_trait
          -A clippy::result_large_err

  bench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo bench -- --test

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo check --no-default-features --features wasm

  feature-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [js-engine]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo check --no-default-features --features ${{ matrix.features }}

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - name: Install Android NDK
        run: |
          ndk="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android
      - run: cargo check --target armv7-linux-androideabi
      - run: cargo check --target x86_64-linux-android

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/fluxa-core/Cargo.toml
          command: check advisories bans sources

  fuzz-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run episode_matching -- -runs=1000
      - run: cd fuzz && cargo fuzz run percent_decode -- -runs=1000
      - run: cd fuzz && cargo fuzz run manifest_parse -- -runs=1000
      - run: cd fuzz && cargo fuzz run engine_dispatch -- -runs=1000

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
