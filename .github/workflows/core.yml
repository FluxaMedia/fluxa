name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core/fluxa-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo test --workspace --all-targets
      - run: cargo test --doc

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo clippy --workspace --all-targets -- -D warnings

  bench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo bench --features bench -- --test

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo check --no-default-features --features wasm

  feature-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [streaming-shared, desktop, uniffi-bindings]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo check --no-default-features --features ${{ matrix.features }}

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fluxa-core
      - run: cargo check --target aarch64-linux-android
      - run: cargo check --target armv7-linux-androideabi
      - run: cargo check --target x86_64-linux-android

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run episode_matching -- -runs=1000
      - run: cd fuzz && cargo fuzz run percent_decode -- -runs=1000
      - run: cd fuzz && cargo fuzz run manifest_parse -- -runs=1000
      - run: cd fuzz && cargo fuzz run engine_dispatch -- -runs=1000

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
