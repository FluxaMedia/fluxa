name: Web

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "core/**"
      - "shared/**"
      - "scripts/build-web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  RUST_VERSION: "1.94.0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: pages

      - name: Install wasm-bindgen
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --manifest-path native/Cargo.toml --format-version 1 | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(m.packages.find(p=>p.name==="wasm-bindgen").version)')"

      - name: Build site
        run: ./scripts/build-web.sh dist-web/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web/site

      - id: deployment
        uses: actions/deploy-pages@v4
