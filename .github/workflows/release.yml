name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.0)
        required: true

env:
  NDK_VERSION: "28.2.13676358"
  RUST_VERSION: "1.99.1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/android
        run: ../../.github/scripts/build-release-notes.sh "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: apps/android/notes.md

  android:
    name: android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mobile
            task: assembleMobileRelease
          - flavor: tv
            task: assembleTvRelease
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version
        run: |
          node scripts/set-version.mjs "$RELEASE_TAG"
          echo "FLUXA_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/fluxa-core
            core/fluxa-core/fluxa-streaming-engine

      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        working-directory: apps/android
        run: echo "${{ secrets.FLUXA_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks

      - name: Build release APKs (per-ABI split)
        working-directory: apps/android
        env:
          FLUXA_RELEASE_STORE_FILE: release.keystore.jks
          FLUXA_RELEASE_STORE_PASSWORD: ${{ secrets.FLUXA_RELEASE_STORE_PASSWORD }}
          FLUXA_RELEASE_KEY_ALIAS: ${{ secrets.FLUXA_RELEASE_KEY_ALIAS }}
          FLUXA_RELEASE_KEY_PASSWORD: ${{ secrets.FLUXA_RELEASE_KEY_PASSWORD }}
          FLUXA_TRAKT_CLIENT_ID: ${{ secrets.FLUXA_TRAKT_CLIENT_ID }}
          FLUXA_TRAKT_CLIENT_SECRET: ${{ secrets.FLUXA_TRAKT_CLIENT_SECRET }}
          FLUXA_SIMKL_CLIENT_ID: ${{ secrets.FLUXA_SIMKL_CLIENT_ID }}
          FLUXA_SIMKL_CLIENT_SECRET: ${{ secrets.FLUXA_SIMKL_CLIENT_SECRET }}
          FLUXA_ANILIST_CLIENT_ID: ${{ secrets.FLUXA_ANILIST_CLIENT_ID }}
          FLUXA_ANILIST_CLIENT_SECRET: ${{ secrets.FLUXA_ANILIST_CLIENT_SECRET }}
          FLUXA_MDBLIST_CLIENT_ID: ${{ secrets.FLUXA_MDBLIST_CLIENT_ID }}
          FLUXA_NUVIO_SUPABASE_URL: ${{ secrets.FLUXA_NUVIO_SUPABASE_URL }}
          FLUXA_NUVIO_SUPABASE_KEY: ${{ secrets.FLUXA_NUVIO_SUPABASE_KEY }}
          FLUXA_SYNC_URL: ${{ secrets.FLUXA_SYNC_URL }}
          FLUXA_SYNC_KEY: ${{ secrets.FLUXA_SYNC_KEY }}
          FLUXA_SENTRY_DSN: ${{ secrets.FLUXA_SENTRY_DSN }}
        run: ./gradlew :app:${{ matrix.task }} --no-daemon

      - name: Remove release keystore
        if: always()
        working-directory: apps/android
        run: rm -f release.keystore.jks

      - name: Collect APKs
        run: |
          mkdir -p out
          for flavor in ${{ matrix.flavor }}; do
            for apk in apps/android/app/build/outputs/apk/$flavor/release/*.apk; do
              abi="$(basename "$apk" .apk | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86|universal' | head -n 1)"
              cp "$apk" "out/fluxa-${RELEASE_TAG#v}-android-$flavor-${abi:-universal}.apk"
              echo "android-$flavor-${abi:-universal}=fluxa-${RELEASE_TAG#v}-android-$flavor-${abi:-universal}.apk" >> "out/fluxa-${RELEASE_TAG#v}-android-$flavor.updatekeys"
            done
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: |
            out/*.apk
            out/*.updatekeys

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      FLUXA_TRAKT_CLIENT_ID: ${{ secrets.FLUXA_TRAKT_CLIENT_ID }}
      FLUXA_TRAKT_CLIENT_SECRET: ${{ secrets.FLUXA_TRAKT_CLIENT_SECRET }}
      FLUXA_SIMKL_CLIENT_ID: ${{ secrets.FLUXA_SIMKL_CLIENT_ID }}
      FLUXA_SIMKL_CLIENT_SECRET: ${{ secrets.FLUXA_SIMKL_CLIENT_SECRET }}
      FLUXA_ANILIST_CLIENT_ID: ${{ secrets.FLUXA_ANILIST_CLIENT_ID }}
      FLUXA_ANILIST_CLIENT_SECRET: ${{ secrets.FLUXA_ANILIST_CLIENT_SECRET }}
      FLUXA_MDBLIST_CLIENT_ID: ${{ secrets.FLUXA_MDBLIST_CLIENT_ID }}
      FLUXA_NUVIO_SUPABASE_URL: ${{ secrets.FLUXA_NUVIO_SUPABASE_URL }}
      FLUXA_NUVIO_SUPABASE_KEY: ${{ secrets.FLUXA_NUVIO_SUPABASE_KEY }}
      FLUXA_SYNC_URL: ${{ secrets.FLUXA_SYNC_URL }}
      FLUXA_SYNC_KEY: ${{ secrets.FLUXA_SYNC_KEY }}
      FLUXA_SENTRY_DSN: ${{ secrets.FLUXA_SENTRY_DSN }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev librsvg2-bin rpm desktop-file-utils

      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: brew install librsvg

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress

      - name: Stamp version
        shell: bash
        run: node scripts/set-version.mjs "$RELEASE_TAG"

      - name: Fetch libmpv
        shell: bash
        run: native/fluxa-mpv/fetch-libmpv.sh

      - name: Package
        shell: bash
        run: scripts/package-desktop.sh "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/fluxa-*

  apple:
    name: apple (${{ matrix.name }})
    runs-on: macos-latest
    env:
      FLUXA_TRAKT_CLIENT_ID: ${{ secrets.FLUXA_TRAKT_CLIENT_ID }}
      FLUXA_TRAKT_CLIENT_SECRET: ${{ secrets.FLUXA_TRAKT_CLIENT_SECRET }}
      FLUXA_SIMKL_CLIENT_ID: ${{ secrets.FLUXA_SIMKL_CLIENT_ID }}
      FLUXA_SIMKL_CLIENT_SECRET: ${{ secrets.FLUXA_SIMKL_CLIENT_SECRET }}
      FLUXA_ANILIST_CLIENT_ID: ${{ secrets.FLUXA_ANILIST_CLIENT_ID }}
      FLUXA_ANILIST_CLIENT_SECRET: ${{ secrets.FLUXA_ANILIST_CLIENT_SECRET }}
      FLUXA_MDBLIST_CLIENT_ID: ${{ secrets.FLUXA_MDBLIST_CLIENT_ID }}
      FLUXA_NUVIO_SUPABASE_URL: ${{ secrets.FLUXA_NUVIO_SUPABASE_URL }}
      FLUXA_NUVIO_SUPABASE_KEY: ${{ secrets.FLUXA_NUVIO_SUPABASE_KEY }}
      FLUXA_SYNC_URL: ${{ secrets.FLUXA_SYNC_URL }}
      FLUXA_SYNC_KEY: ${{ secrets.FLUXA_SYNC_KEY }}
      FLUXA_SENTRY_DSN: ${{ secrets.FLUXA_SENTRY_DSN }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios
            scheme: FluxaIos
            sdk: iphoneos
            destination: generic/platform=iOS
            rust_target: aarch64-apple-ios
          - name: tvos
            scheme: FluxaTvos
            sdk: appletvos
            destination: generic/platform=tvOS
            rust_target: aarch64-apple-tvos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Set up nightly Rust for tvOS
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-apple-${{ matrix.name }}

      - name: Stamp version
        run: node scripts/set-version.mjs "$RELEASE_TAG"

      - name: Build Rust renderer
        env:
          CONFIGURATION: Release
          FLUXA_APPLE_TARGETS: ${{ matrix.rust_target }}
        run: apps/apple/scripts/build-rust-core-xcframework.sh

      - name: Fetch libmpv
        run: apps/apple/scripts/fetch-libmpv.sh

      - name: Set up XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Apple host project
        working-directory: apps/apple
        run: xcodegen generate

      - name: Build unsigned app
        env:
          FLUXA_SKIP_RUST_CORE_BUILD: "1"
        working-directory: apps/apple
        run: >-
          xcodebuild
          -project FluxaApple.xcodeproj
          -scheme ${{ matrix.scheme }}
          -sdk ${{ matrix.sdk }}
          -destination '${{ matrix.destination }}'
          -configuration Release
          -derivedDataPath build
          MARKETING_VERSION="${RELEASE_TAG#v}"
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned ipa
        run: |
          app="$(find apps/apple/build/Build/Products -maxdepth 2 -name '*.app' | head -n 1)"
          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry "fluxa-${RELEASE_TAG#v}-${{ matrix.name }}-unsigned.ipa" Payload)
          rm -rf out/Payload

      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.name }}
          path: out/*.ipa

  webos-native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEBOS_TOOLCHAIN: ${{ github.workspace }}/.webos-toolchain
      WEBOS_SDK: ${{ github.workspace }}/.webos-toolchain/sdk
      FFMPEG_SRC: ${{ github.workspace }}/.webos-toolchain/ffmpeg-src
      FFMPEG_OUT: ${{ github.workspace }}/.webos-toolchain/ffmpeg-arm
      SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
      FFMPEG_URL: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: armv7-unknown-linux-gnueabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-webos-native

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: .webos-toolchain
          key: webos-toolchain-2026.08-ffmpeg-9.0.2-${{ hashFiles('scripts/build-ffmpeg-webos.sh') }}

      - name: Install toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev nasm
          mkdir -p "$WEBOS_SDK" "$FFMPEG_SRC"
          curl -fsSL "$SDK_URL" | tar -xz --strip-components=1 -C "$WEBOS_SDK"
          "$WEBOS_SDK/relocate-sdk.sh"
          curl -fsSL "$FFMPEG_URL" | tar -xJ --strip-components=1 -C "$FFMPEG_SRC"
          ./scripts/build-ffmpeg-webos.sh

      - name: Install clang
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Stamp version
        run: node scripts/set-version.mjs "$RELEASE_TAG"

      - name: Package ipk
        env:
          FLUXA_SENTRY_DSN: ${{ secrets.FLUXA_SENTRY_DSN }}
        run: |
          ./scripts/package-webos-native.sh "$RELEASE_TAG"
          mkdir -p out
          cp dist-web/fluxa-*-webos-native.ipk out/

      - name: Verify ipk against webOS firmware
        continue-on-error: true
        run: |
          base=https://github.com/webosbrew/dev-toolbox-cli/releases/download/v20260818-ea38b20
          curl -fsSL -o ipk-verify.deb "$base/webosbrew-toolbox-ipk-verify_0.9.0-1_amd64.deb"
          curl -fsSL -o fw-symbols.deb "$base/webosbrew-toolbox-fw-symbols_0.9.0-1_amd64.deb"
          sudo dpkg -i fw-symbols.deb ipk-verify.deb
          ./scripts/verify-webos.sh out/fluxa-*-webos-native.ipk ">=4.0"

      - uses: actions/upload-artifact@v4
        with:
          name: webos-native
          path: out/*.ipk

  publish:
    needs: [notes, android, desktop, apple, webos-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release files
        run: |
          mkdir -p release keys
          find artifacts -type f -name '*.updatekeys' -exec cp {} keys/ \;
          find artifacts -type f ! -name notes.md ! -name '*.updatekeys' -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release

      - name: Build signed update manifest
        env:
          FLUXA_UPDATE_PRIVATE_KEY: ${{ secrets.FLUXA_UPDATE_PRIVATE_KEY }}
        run: |
          keys=()
          for file in keys/*.updatekeys; do keys+=(--keys-file "$file"); done
          node scripts/update-manifest.mjs build \
            --version "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes artifacts/notes/notes.md \
            --dir release \
            --require "$(cat shared/update-required-assets.txt | paste -sd, -)" \
            --out release/latest.json \
            "${keys[@]}"

      - name: Build SideStore source
        run: |
          ipa="$(ls release/fluxa-*-ios-unsigned.ipa)"
          unzip -p "$ipa" 'Payload/*.app/Info.plist' > ios-info.plist
          read -r bundle_id build min_os < <(python3 -c 'import plistlib; p = plistlib.load(open("ios-info.plist", "rb")); print(p["CFBundleIdentifier"], p["CFBundleVersion"], p["MinimumOSVersion"])')
          node scripts/sidestore-source.mjs \
            --version "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --ipa "$ipa" \
            --bundle-id "$bundle_id" \
            --build "$build" \
            --min-os "$min_os" \
            --notes artifacts/notes/notes.md \
            --out sidestore.json
          rm ios-info.plist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Fluxa ${{ env.RELEASE_TAG }}"
          body_path: artifacts/notes/notes.md
          files: release/*

      - name: Verify published update manifest
        run: node scripts/verify-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch

      - name: Commit SideStore source
        continue-on-error: true
        run: |
          cp sidestore.json default-branch/sidestore.json
          cd default-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): update the SideStore source for $RELEASE_TAG"
          git pull --rebase
          git push

  aur:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Write PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          sha=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            -q ".assets[] | select(.name == \"fluxa-$version-linux-amd64.deb\") | .digest" | sed 's/^sha256://')
          [ -n "$sha" ]
          cat > PKGBUILD <<PKG
          # Maintainer: KhooLy <seslikitapicinkhooly@gmail.com>
          pkgname=fluxa-desktop-bin
          pkgver=$version
          pkgrel=1
          pkgdesc="Cross-platform media center for streaming and managing your media library"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('GPL-3.0-only')
          depends=('glibc' 'vulkan-icd-loader')
          provides=('fluxa-desktop')
          conflicts=('fluxa-desktop')
          options=('!strip')
          source=("fluxa-desktop-\${pkgver}.deb::\${url}/releases/download/v\${pkgver}/fluxa-\${pkgver}-linux-amd64.deb")
          sha256sums=('$sha')

          package() {
            bsdtar -xf data.tar.gz -C "\$pkgdir"
          }
          PKG

      - uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: fluxa-desktop-bin
          pkgbuild: ./PKGBUILD
          commit_username: KhooLy
          commit_email: seslikitapicinkhooly@gmail.com
          commit_message: Update to ${{ env.RELEASE_TAG }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
