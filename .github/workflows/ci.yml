name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  RUST_VERSION: "stable"

jobs:
  check:
    name: cargo check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: FluxaMedia/fluxa-core
          path: fluxa-core

      - name: Link sibling repos
        shell: bash
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          if [ "${{ matrix.name }}" = "windows" ]; then
            cmd //c mklink //J "$PARENT\\fluxa-core" "$GITHUB_WORKSPACE\\fluxa-core"
          else
            ln -sfn "$GITHUB_WORKSPACE/fluxa-core" "$PARENT/fluxa-core"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-${{ matrix.name }}

      - name: Install system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo sed -i 's|mirror://mirrors.ubuntu.com/mirrors.txt|http://archive.ubuntu.com/ubuntu/|; s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev \
            libass9 libplacebo-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # tauri_build only resolves frontendDist and the bundle resource globs; the real
      # frontend and libmpv payload are built in build.yml.
      - name: Stub bundle inputs
        shell: bash
        run: |
          mkdir -p dist && touch dist/index.html
          mkdir -p src-tauri/lib && touch src-tauri/lib/placeholder

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --lib --bins --tests

      # Informational until the existing ~80 warnings are cleared; check/test are the hard gates.
      - name: cargo clippy
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --lib --bins --tests

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
