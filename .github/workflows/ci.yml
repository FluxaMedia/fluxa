name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  RUST_VERSION: "stable"
  # Placeholders only. These are baked in with env!() at compile time; a type-check
  # job never calls the services, and dummies keep the workflow working on fork PRs
  # where repository secrets are unavailable.
  FLUXA_TRAKT_CLIENT_ID: ci
  FLUXA_TRAKT_CLIENT_SECRET: ci
  FLUXA_ANILIST_CLIENT_ID: ci
  FLUXA_ANILIST_CLIENT_SECRET: ci
  FLUXA_SIMKL_CLIENT_ID: ci
  FLUXA_MDBLIST_CLIENT_ID: ci
  FLUXA_SIMKL_CLIENT_SECRET: ci
  FLUXA_NUVIO_SUPABASE_URL: https://ci.invalid
  FLUXA_NUVIO_SUPABASE_KEY: ci

jobs:
  monorepo-contracts:
    name: monorepo structure and generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository structure
        run: node scripts/check-monorepo.mjs
      - name: Check shared i18n keys
        run: node scripts/check-i18n.mjs
      - name: Check generated headless contracts
        run: node scripts/generate-headless-contracts.mjs --check

  check:
    name: native cargo check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ci-${{ matrix.name }}

      - name: cargo check
        run: cargo check --manifest-path native/Cargo.toml -p fluxa-desktop --tests

      - name: cargo test
        run: cargo test --manifest-path native/Cargo.toml -p fluxa-desktop
