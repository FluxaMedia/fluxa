name: Apple

on:
  pull_request:
    paths:
      - ".github/workflows/apple.yml"
      - "apps/apple/**"
      - "native/**"
      - "core/fluxa-core/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/apple.yml"
      - "apps/apple/**"
      - "native/**"
      - "core/fluxa-core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: FluxaIos
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator
          - scheme: FluxaTvos
            sdk: appletvsimulator
            destination: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Set up nightly Rust for tvOS
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true

      - name: Build Rust renderer
        run: apps/apple/scripts/build-rust-core-xcframework.sh

      - name: Fetch libmpv
        run: apps/apple/scripts/fetch-libmpv.sh

      - name: Set up XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Apple host project
        working-directory: apps/apple
        run: xcodegen generate

      - name: Build host
        env:
          FLUXA_SKIP_RUST_CORE_BUILD: "1"
        working-directory: apps/apple
        run: >-
          xcodebuild
          -project FluxaApple.xcodeproj
          -scheme ${{ matrix.scheme }}
          -sdk ${{ matrix.sdk }}
          -destination '${{ matrix.destination }}'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
