name: Release cache

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "core/**"
      - "scripts/package-desktop.sh"
      - "apps/android/build-logic/**"
      - ".github/workflows/release-cache.yml"
  workflow_dispatch:

env:
  RUST_VERSION: "1.99.1"

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - name: Fetch libmpv
        shell: bash
        run: native/fluxa-mpv/fetch-libmpv.sh

      - name: Build
        shell: bash
        run: cargo build --release --manifest-path native/Cargo.toml -p fluxa-desktop

  android-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-android-${{ matrix.abi }}

      - name: Install Android NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Build renderer
        working-directory: apps/android
        run: ./gradlew :app:buildFluxaAndroidRenderer -PfluxaRustProfile=release -PfluxaRustAbis=${{ matrix.abi }} --no-daemon
