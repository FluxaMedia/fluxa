name: Release cache

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "core/**"
      - "scripts/package-desktop.sh"
      - ".github/workflows/release-cache.yml"
  workflow_dispatch:

env:
  RUST_VERSION: "1.94.0"

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - name: Fetch libmpv
        shell: bash
        run: native/fluxa-mpv/fetch-libmpv.sh

      - name: Build
        shell: bash
        run: cargo build --release --manifest-path native/Cargo.toml -p fluxa-desktop
