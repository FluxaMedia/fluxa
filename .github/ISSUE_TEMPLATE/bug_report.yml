name: Bug report
description: Report a reproducible problem in Fluxa.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and remove sensitive data from logs.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - Android TV
        - iOS
        - tvOS
        - Windows
        - macOS
        - Linux
        - Web
        - webOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 2.1.7 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what happened before the problem appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
    validations:
      required: false
