name: Feature request
description: Suggest an improvement for Fluxa.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - All
        - Android
        - Android TV
        - iOS
        - tvOS
        - Windows
        - macOS
        - Linux
        - Web
        - webOS
    validations:
      required: false
