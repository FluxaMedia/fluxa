name: FluxaApple
options:
  xcodeVersion: "16.4"
  deploymentTarget:
    iOS: "18.5"
    tvOS: "17.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../../native/fluxa-apple-renderer/include"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Generated"
    OTHER_LDFLAGS[sdk=iphoneos*]: "-lfluxa_apple_renderer-ios"
    OTHER_LDFLAGS[sdk=iphonesimulator*]: "-lfluxa_apple_renderer-ios-simulator"
    OTHER_LDFLAGS[sdk=appletvos*]: "-lfluxa_apple_renderer-tvos"
    OTHER_LDFLAGS[sdk=appletvsimulator*]: "-lfluxa_apple_renderer-tvos-simulator"
targetTemplates:
  FluxaHost:
    type: application
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: FluxaApple
            CFBundleURLSchemes:
              - fluxaapple
    sources:
      - path: Host
    resources:
      - path: ../../shared/i18n
    dependencies:
      - framework: Vendor/Libmpv.xcframework
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
    preBuildScripts:
      - name: Fetch libmpv
        script: scripts/fetch-libmpv.sh
        basedOnDependencyAnalysis: false
      - name: Build Fluxa Rust renderer
        script: scripts/build-rust-core-xcframework.sh
        basedOnDependencyAnalysis: false
targets:
  FluxaIos:
    templates: [FluxaHost]
    platform: iOS
  FluxaTvos:
    templates: [FluxaHost]
    platform: tvOS
