name: FluxaApple
options:
  xcodeVersion: "16.4"
  deploymentTarget:
    iOS: "18.5"
    tvOS: "17.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated/FluxaRustCoreFFI"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Generated"
    OTHER_LDFLAGS[sdk=iphoneos*]: "-lfluxa_apple_renderer-ios -lfluxa_streaming_engine-ios"
    OTHER_LDFLAGS[sdk=iphonesimulator*]: "-lfluxa_apple_renderer-ios-simulator -lfluxa_streaming_engine-ios-simulator"
    OTHER_LDFLAGS[sdk=appletvos*]: "-lfluxa_core-tvos -lfluxa_streaming_engine-tvos"
    OTHER_LDFLAGS[sdk=appletvsimulator*]: "-lfluxa_core-tvos-simulator -lfluxa_streaming_engine-tvos-simulator"
packages:
  FluxaPlayerKit:
    path: FluxaPlayerKit
targets:
  FluxaIos:
    type: application
    platform: iOS
    settings:
      base:
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../../native/fluxa-apple-renderer/include"
    info:
      path: Generated/FluxaIos-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: FluxaApple
            CFBundleURLSchemes:
              - fluxaapple
    sources:
      - path: iOS/FluxaIosApp.swift
      - path: iOS/FluxaNativeRendererView.swift
      - path: iOS/FluxaNativeVideo.swift
    resources:
      - path: ../../shared/i18n
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
    preBuildScripts:
      - name: Build Fluxa Rust Core
        script: scripts/build-rust-core-xcframework.sh
        basedOnDependencyAnalysis: false
  FluxaTvos:
    type: application
    platform: tvOS
    sources:
      - path: Shared/FluxaAppleCustomPlayerViewController.swift
      - path: Shared/FluxaAppleAVPlayerStreamAdapter.swift
      - path: AppleCore
        excludes:
          - FluxaAppleAddonStoreManager.swift
          - FluxaAppleDownloadManager.swift
          - FluxaApplePluginRepositoryManager.swift
      - path: tvOS
      - path: Generated/FluxaRustCore.swift
    resources:
      - path: ../../shared/i18n
    dependencies:
      - package: FluxaPlayerKit
    preBuildScripts:
      - name: Build Fluxa Rust Core
        script: scripts/build-rust-core-xcframework.sh
        basedOnDependencyAnalysis: false
      - name: Build FluxaCore
        script: ../android/gradlew -p ../android :core:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
      - name: Build FluxaData
        script: ../android/gradlew -p ../android :data:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
      - name: Build FluxaPlayer
        script: ../android/gradlew -p ../android :player:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
