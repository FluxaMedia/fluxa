[workspace]
members = ["fluxa-media", "fluxa-plugin-runtime", "fluxa-streaming-engine"]
exclude = ["fuzz"]
resolver = "2"

[profile.dev]
debug = 1
incremental = true

[workspace.dependencies]
fluxa_core = { path = "." }
fluxa_media = { path = "fluxa-media" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[package]
name = "fluxa_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[features]
default = ["js-engine"]
js-engine = ["dep:rquickjs"]
wasm = ["dep:wasm-bindgen", "chrono/wasmbind"]
fuzzing = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1"
rquickjs = { version = "0.12.1", default-features = false, features = ["std", "chrono", "loader", "dyn-load", "either", "indexmap", "futures"], optional = true }
url = "2"
sha2 = "0.11.0"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
web-time = "1"

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "tvos"))'.dependencies]
rquickjs = { version = "0.12.1", default-features = false, features = ["std", "chrono", "loader", "dyn-load", "either", "indexmap", "futures", "bindgen"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "hot_paths"
harness = false
