[package]
name = "fluxa-skin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Renderer-independent skin layouts and extension manifests."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
