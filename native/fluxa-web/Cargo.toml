[package]
name = "fluxa-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fluxa-artwork = { path = "../fluxa-artwork" }
fluxa-host = { path = "../fluxa-host" }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false }
raw-window-handle = "0.6"
wasm-bindgen = "0.2"
wgpu = { version = "29.0.3", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "Window",
    "console",
] }
