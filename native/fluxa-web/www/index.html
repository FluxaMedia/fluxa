<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxa</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
html, body { margin: 0; height: 100%; background: #070709; overflow: hidden; }
#a11y { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#a11y > * { position: absolute; margin: 0; padding: 0; border: 0; opacity: 0; overflow: hidden; pointer-events: none; font-size: 16px; }
video { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; object-fit: contain; }
#artwork, #artwork-top { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
#artwork-top { z-index: 1; }
#artwork > img, #artwork-top > img { position: absolute; object-fit: cover; background: #1b1b20; display: none; }
canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
</style>
</head>
<body>
<video id="video" playsinline preload="auto"></video>
<div id="artwork"></div>
<canvas id="fluxa" tabindex="0"></canvas>
<div id="artwork-top"></div>
<div id="a11y"></div>
<script type="module" src="main.js"></script>
</body>
</html>
