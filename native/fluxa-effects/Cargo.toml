[package]
name = "fluxa-effects"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["fluxa_core/js-engine"]

[dependencies]
fluxa-app = { path = "../fluxa-app", default-features = false }
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
serde_json = "1.0"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["js-engine"] }
fluxa-mpv = { path = "../fluxa-mpv" }
libc = "0.2"
log = "0.4"
fluxa_plugin_runtime = { path = "../../core/fluxa-core/fluxa-plugin-runtime" }
fluxa_streaming_engine = { path = "../../core/fluxa-core/fluxa-streaming-engine", default-features = false, features = ["native"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
webpki-root-certs = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["wasm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "WebSocket", "MessageEvent", "Crypto"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
