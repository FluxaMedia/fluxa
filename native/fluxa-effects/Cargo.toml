[package]
name = "fluxa-effects"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["fluxa_core/desktop"]

[dependencies]
aes-gcm = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["full-api", "plugin-js-engine"] }
fluxa_streaming_engine = { path = "../../core/fluxa-core/fluxa-streaming-engine", default-features = false, features = ["native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
