[package]
name = "fluxa-effects"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["fluxa_core/js-engine"]

[dependencies]
fluxa-app = { path = "../fluxa-app", default-features = false }
futures = "0.3"
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["js-engine"] }
fluxa_streaming_engine = { path = "../../core/fluxa-core/fluxa-streaming-engine", default-features = false, features = ["native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["wasm"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
