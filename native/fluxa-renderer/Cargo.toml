[package]
name = "fluxa-renderer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "WGPU scene and egui painter backend for Fluxa UI surfaces."

[features]
default = ["desktop-demo"]
desktop-demo = ["dep:pollster", "dep:winit"]

[dependencies]
ahash = { version = "0.8", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.37"
egui-wgpu = "0.37"
fluxa-theme = { path = "../fluxa-theme" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = { version = "1", optional = true }
resvg = "0.48"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.12"
wgpu = { version = "30", default-features = false, features = ["dx12", "gles", "metal", "vulkan", "wgsl"] }
winit = { version = "0.30.13", optional = true }

[[example]]
name = "native-home"
required-features = ["desktop-demo"]
