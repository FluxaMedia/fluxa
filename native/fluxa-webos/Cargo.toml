[package]
name = "fluxa-webos"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
sentry = ["dep:sentry"]

[dependencies]
libloading = "0.8"
serde_json = "1.0"
sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
