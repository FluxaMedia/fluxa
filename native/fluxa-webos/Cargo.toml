[package]
name = "fluxa-webos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
sentry = ["dep:sentry", "dep:libc"]
ffmpeg = ["dep:ffmpeg-next", "dep:dolby_vision"]
ffmpeg-static = ["ffmpeg", "ffmpeg-next/static"]
host = ["dep:fluxa-host"]
app = ["host", "ffmpeg", "sentry", "dep:wgpu", "dep:raw-window-handle", "dep:fluxa-renderer"]

[dependencies]
libloading = "0.8"
libc = { version = "0.2", optional = true }
dolby_vision = { version = "3", default-features = false, optional = true }
serde_json = "1.0"
sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
ffmpeg-next = { version = "9.0", optional = true, default-features = false, features = ["format", "codec", "software-resampling"] }
fluxa-host = { path = "../fluxa-host", optional = true }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false, optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29.0.3", default-features = false, features = ["gles", "wgsl"], optional = true }

[build-dependencies]
cc = "1"

[[bin]]
name = "fluxa-webos"
path = "src/bin/app.rs"
required-features = ["app"]
