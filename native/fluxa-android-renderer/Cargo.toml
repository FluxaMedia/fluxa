[package]
name = "fluxa-android-renderer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Android Surface/JNI host for Fluxa's Rust WGPU renderer."

[lib]
crate-type = ["cdylib"]

[dependencies]
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["js-engine"] }
fluxa-crash = { path = "../fluxa-crash" }
fluxa-host = { path = "../fluxa-host" }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false }
jni = "0.22"
raw-window-handle = "0.6"
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["gles", "vulkan", "wgsl"] }
