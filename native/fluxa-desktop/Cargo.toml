[package]
name = "fluxa-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native desktop shell for Fluxa's Rust renderer migration."

[dependencies]
egui = "0.34.2"
fluxa-effects = { path = "../fluxa-effects" }
fluxa-host = { path = "../fluxa-host" }
fluxa-mpv = { path = "../fluxa-mpv" }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false }
gilrs = "0.11.2"
log = "0.4"
serde_json = "1.0"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
winit = "0.30.12"
wgpu = { version = "29.0.3", default-features = false, features = ["dx12", "gles", "metal", "vulkan", "vulkan-portability", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
ash = "0.38"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
fontdb = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rustybuzz = "0.20"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
