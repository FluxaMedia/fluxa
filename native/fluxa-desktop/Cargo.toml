[package]
name = "fluxa-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native desktop shell for Fluxa's Rust renderer migration."
build = "build.rs"

[dependencies]
ab_glyph = "0.2.32"
ash = "0.38"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
egui = "0.34.2"
egui-winit = "0.34.2"
gilrs = "0.11.2"
libc = "0.2"
aes-gcm = "0.11"
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["desktop"] }
fluxa_streaming_engine = { path = "../../core/fluxa-core/fluxa-streaming-engine", default-features = false, features = ["native"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libloading = "0.8"
log = "0.4"
pollster = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
raw-window-handle = "0.6"
resvg = { version = "0.45.0", default-features = false }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false, features = ["desktop-demo"] }
fluxa-ui = { path = "../fluxa-ui" }
fluxa-app = { path = "../fluxa-app", features = ["desktop"] }
fluxa-artwork = { path = "../fluxa-artwork" }
fluxa-effects = { path = "../fluxa-effects" }
fluxa-mpv = { path = "../fluxa-mpv" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tiny-skia = "0.11.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
winit = "0.30.12"
wgpu = { version = "29.0.3", default-features = false, features = ["dx12", "gles", "metal", "vulkan", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
