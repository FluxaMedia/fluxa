[package]
name = "fluxa-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Platform-neutral host for the Fluxa renderer: screen state, input, artwork, frame loop and core session."

[dependencies]
egui = "0.34.2"
fluxa-artwork = { path = "../fluxa-artwork" }
fluxa-effects = { path = "../fluxa-effects", default-features = false }
fluxa-renderer = { path = "../fluxa-renderer", default-features = false }
fluxa-ui = { path = "../fluxa-ui" }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-time = "1"
wgpu = { version = "29.0.3", default-features = false, features = ["wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["js-engine"] }
mdns-sd = "0.21"
pollster = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
fluxa_core = { path = "../../core/fluxa-core", default-features = false, features = ["wasm"] }
wasm-bindgen-futures = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
discord-rich-presence = "1"
