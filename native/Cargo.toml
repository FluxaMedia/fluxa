[workspace]
resolver = "2"
members = ["fluxa-crash", "fluxa-renderer", "fluxa-theme", "fluxa-ui", "fluxa-app", "fluxa-artwork", "fluxa-desktop", "fluxa-android-renderer", "fluxa-host", "fluxa-effects", "fluxa-mpv", "fluxa-web", "fluxa-apple-renderer", "fluxa-updater", "fluxa-trickplay-gen", "fluxa-webos"]

[patch.crates-io]
epaint = { path = "vendor/epaint" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

# Keep CPU-heavy artwork decoding representative of release performance while
# running the native app in the dev profile. Animated WebP decoding is handled
# by this pure-Rust dependency, whose unoptimized loops otherwise dominate
# image preparation time by orders of magnitude.
[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fluxa-artwork]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
