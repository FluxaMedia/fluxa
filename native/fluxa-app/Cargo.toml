[package]
name = "fluxa-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared Fluxa Core application runtime for desktop, Android and TV hosts."

[features]
default = ["desktop"]
desktop = ["fluxa_core/js-engine"]
android = ["fluxa_core/js-engine"]

[dependencies]
fluxa_core = { path = "../../core/fluxa-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
