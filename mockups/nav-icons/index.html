<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav icon options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Material+Icons&family=Material+Icons+Outlined&family=Material+Icons+Round">
<style>
:root {
  --bg: #0b0d10;
  --card: #14171c;
  --line: rgba(255, 255, 255, 0.08);
  --text: #f2f4f7;
  --muted: #8a919c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 32px 24px 64px;
}
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 24px; }
.controls { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.controls button {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  font: inherit;
}
.controls button.on { background: #fff; color: #000; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.card h2 { font-size: 16px; margin: 0; padding: 16px 16px 2px; }
.card p { margin: 0; padding: 0 16px 12px; color: var(--muted); font-size: 12.5px; }
.stage {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(120% 140% at 20% 0%, #5b7384 0%, #2b3640 45%, #14181d 100%);
}
.bar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 999px;
  background: rgba(20, 22, 26, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
}
.tab {
  width: calc(var(--s) + 26px);
  height: 44px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.62);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.tab.active { background: rgba(255, 255, 255, 0.2); color: #fff; }
.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  margin: 0 7px;
  background: conic-gradient(from 30deg, #ffb74d, #7cb342, #e53935, #ffb74d);
}
.ic {
  width: var(--s);
  height: var(--s);
  background: currentColor;
  -webkit-mask: var(--u) center / contain no-repeat;
  mask: var(--u) center / contain no-repeat;
}
.mi {
  font-family: "Material Symbols Outlined";
  font-size: var(--s);
  line-height: 1;
  font-variation-settings: "FILL" 0, "wght" 400;
}
.tab.active .mi { font-variation-settings: "FILL" 1, "wght" 400; }
.pairs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 14px 16px 16px;
  border-top: 1px solid var(--line);
}
.pair {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #fff;
}
.pair .row { display: flex; gap: 14px; align-items: center; }
.pair small { color: var(--muted); font-size: 11px; }
.pair .mi { font-variation-settings: "FILL" 0, "wght" 400; }
.pair .mi.f { font-variation-settings: "FILL" 1, "wght" 400; }
.mc {
  font-size: var(--s);
  line-height: 1;
  font-feature-settings: "liga";
  letter-spacing: normal;
  text-transform: none;
  white-space: nowrap;
}
</style>
</head>
<body>
<h1>Nav icon options</h1>
<p class="sub">Tabs are clickable. Top row of each card is the top bar at the chosen size, bottom row is outline next to filled.</p>
<div class="controls" id="sizes"></div>
<div class="grid" id="grid"></div>
<script>
const unpkg = (path) => `url(https://unpkg.com/${path})`;
const svgUri = (body) =>
  `url(data:image/svg+xml;utf8,${encodeURIComponent(`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${body}</svg>`)})`;

const lucide = ["house", "search", "library", "clapperboard"].map((n) =>
  unpkg(`lucide-static@0.469.0/icons/${n}.svg`)
);
const handFilled = [
  svgUri('<path fill="white" fill-rule="evenodd" stroke="white" stroke-width="2" stroke-linejoin="round" d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 21v-8a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v8z"/>'),
  svgUri('<g fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></g>'),
  svgUri('<g fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/></g>'),
  svgUri('<g fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></g>'),
];

const phosphor = (name) => [
  unpkg(`@phosphor-icons/core@2.1.1/assets/regular/${name}.svg`),
  unpkg(`@phosphor-icons/core@2.1.1/assets/fill/${name}-fill.svg`),
];
const remix = (folder, name) => [
  unpkg(`remixicon@4.2.0/icons/${folder}/${name}-line.svg`),
  unpkg(`remixicon@4.2.0/icons/${folder}/${name}-fill.svg`),
];
const ion = (name, plain) => [
  unpkg(`ionicons@7.4.0/dist/svg/${name}-outline.svg`),
  unpkg(`ionicons@7.4.0/dist/svg/${plain || name}.svg`),
];

const options = [
  {
    title: "Current: Lucide, hand-filled",
    note: "What ships now. Outline Lucide with fill added by hand. Door and compass needle are cut out.",
    icons: [0, 1, 2, 3].map((i) => [lucide[i], handFilled[i]]),
  },
  {
    title: "Phosphor (recommended)",
    note: "Official regular + fill weights drawn as pairs. MIT.",
    icons: [phosphor("house"), phosphor("magnifying-glass"), phosphor("books"), phosphor("film-slate")],
  },
  {
    title: "Remix Icon",
    note: "Every icon has a -line and -fill pair. Crisper corners. Apache 2.0.",
    icons: [
      remix("Buildings", "home-4"),
      remix("System", "search"),
      remix("Document", "book-2"),
      remix("Media", "movie-2"),
    ],
  },
  {
    title: "Ionicons",
    note: "Outline and filled pairs, iOS flavour. MIT.",
    icons: [ion("home"), ion("search"), ion("library"), ion("film")],
  },
  {
    title: "Material Icons Filled (Compose Icons.Filled)",
    note: "The classic Material Icons that Jetpack Compose ships. Outlined for idle, Filled for active.",
    classic: ["Material Icons Outlined", "Material Icons"],
    material: ["home", "search", "video_library", "movie"],
  },
  {
    title: "Material Icons Rounded (Compose Icons.Rounded)",
    note: "Same set with rounded corners. Outlined for idle, Rounded for active.",
    classic: ["Material Icons Outlined", "Material Icons Round"],
    material: ["home", "search", "video_library", "movie"],
  },
  {
    title: "Material Symbols (Google)",
    note: "Single glyph with a FILL axis, so the swap is perfectly matched. Heavier, Android flavour. Apache 2.0.",
    material: ["home", "search", "video_library", "movie"],
  },
];

let size = 26;
let active = 0;
const grid = document.getElementById("grid");
const sizes = document.getElementById("sizes");

function build() {
  grid.textContent = "";
  document.documentElement.style.setProperty("--s", size + "px");
  options.forEach((option) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>${option.title}</h2><p>${option.note}</p><div class="stage"><div class="bar"></div></div><div class="pairs"></div>`;
    const bar = card.querySelector(".bar");
    const pairs = card.querySelector(".pairs");
    const count = option.material ? option.material.length : option.icons.length;
    for (let i = 0; i < count; i++) {
      const tab = document.createElement("div");
      tab.className = "tab" + (i === active ? " active" : "");
      tab.style.setProperty("--s", size + "px");
      tab.onclick = () => {
        active = i;
        build();
      };
      const pair = document.createElement("div");
      pair.className = "pair";
      pair.style.setProperty("--s", size + "px");
      if (option.classic) {
        const [lineFont, fillFont] = option.classic;
        const glyph = option.material[i];
        tab.innerHTML = `<span class="mc" style="font-family:'${i === active ? fillFont : lineFont}'">${glyph}</span>`;
        pair.innerHTML = `<div class="row"><span class="mc" style="font-family:'${lineFont}'">${glyph}</span><span class="mc" style="font-family:'${fillFont}'">${glyph}</span></div><small>outline / filled</small>`;
      } else if (option.material) {
        tab.innerHTML = `<span class="mi">${option.material[i]}</span>`;
        pair.innerHTML = `<div class="row"><span class="mi">${option.material[i]}</span><span class="mi f">${option.material[i]}</span></div><small>outline / filled</small>`;
      } else {
        const [line, fill] = option.icons[i];
        const icon = document.createElement("span");
        icon.className = "ic";
        icon.style.setProperty("--u", i === active ? fill : line);
        tab.appendChild(icon);
        pair.innerHTML = `<div class="row"><span class="ic" style="--u:${line}"></span><span class="ic" style="--u:${fill}"></span></div><small>outline / filled</small>`;
      }
      bar.appendChild(tab);
      pairs.appendChild(pair);
    }
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    bar.appendChild(avatar);
    grid.appendChild(card);
  });
}

[22, 26, 30].forEach((value) => {
  const button = document.createElement("button");
  button.textContent = value + "px";
  button.className = value === size ? "on" : "";
  button.onclick = () => {
    size = value;
    [...sizes.children].forEach((child) => child.classList.toggle("on", child === button));
    build();
  };
  sizes.appendChild(button);
});
build();
</script>
</body>
</html>
