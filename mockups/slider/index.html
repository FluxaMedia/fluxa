<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duration slider</title>
<style>
:root{--bg:#000;--card:#161618;--card2:#202023;--line:rgba(255,255,255,.09);--ink:#fafafa;--ink2:#a1a1a6;--ink3:#6e6e73;--track:#2a2a2e;--accent:#fff;--accent-ink:#060606;--thumb:24px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto;padding:36px 28px 64px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.row,.srow{border-top:1px solid var(--line)}
.card>:first-child{border-top:0}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px}
b{display:block;font-weight:500;font-size:15px}
small{display:block;color:var(--ink2);font-size:13px;margin-top:1px}
.grow{flex:1}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#3a3a3e}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.sw input:checked+i{background:#fff}
.sw input:checked+i::after{transform:translateX(18px);background:#000}

.srow{padding:16px 18px 12px}
.head{display:flex;align-items:flex-start;gap:16px}
.ctl{display:flex;align-items:center;gap:6px}
.step{width:28px;height:28px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font:500 17px/1 inherit;font-family:inherit;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.step:hover{background:#2e2e33}
.step:disabled{opacity:.3;cursor:default}
.val{min-width:76px;text-align:center;font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.val em{font-style:normal;font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}

.slide{position:relative;height:56px;margin-top:10px}
.slide input{position:absolute;left:0;right:0;top:0;height:34px;width:100%;margin:0;opacity:0;cursor:pointer;z-index:3}
.rail{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:99px;background:var(--track)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);width:calc(var(--thumb)/2 + var(--p)*(100% - var(--thumb)))}
.thumb{position:absolute;top:17px;width:var(--thumb);height:var(--thumb);margin:-12px 0 0 calc(var(--thumb)/-2);left:calc(var(--thumb)/2 + var(--p)*(100% - var(--thumb)));border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6);transition:box-shadow .15s,transform .15s;pointer-events:none}

.bubble{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);padding:4px 10px;border-radius:99px;background:#fff;color:#000;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .15s,transform .15s}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.slide:hover .thumb{box-shadow:0 0 0 7px rgba(255,255,255,.16),0 1px 4px rgba(0,0,0,.6)}
.slide:hover .bubble,.slide:active .bubble{opacity:1;transform:translateX(-50%)}
.slide:active .thumb{transform:scale(1.1)}
.slide input:focus-visible~.thumb{box-shadow:0 0 0 3px #000,0 0 0 5px #fff}
.marks{position:absolute;left:0;right:0;top:38px;height:16px}
.marks span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--ink3);white-space:nowrap}
.marks span.first{transform:none}.marks span.last{transform:translateX(-100%)}
@media(max-width:640px){main{padding:24px 16px}.srow{padding:14px 16px 10px}.step{display:none}.val{min-width:0}}
</style>
</head>
<body>
<main>
<h1>Playback</h1>
<h2>Playback</h2>
<div class="card">
  <label class="row"><div class="grow"><b>Auto-play next episode</b><small>Start the next episode when one ends</small></div><span class="sw"><input type="checkbox" checked><i></i></span></label>
  <div class="srow" id="countdown"></div>
  <label class="row"><div class="grow"><b>Prefer binge group</b><small>Auto-pick the matching binge group source without asking</small></div><span class="sw"><input type="checkbox"><i></i></span></label>
  <div class="srow" id="ttl"></div>
  <div class="srow" id="retry"></div>
  <div class="srow" id="watched"></div>
</div>
</main>
<script>
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b;v+=s)o.push(v);return o}
const fmt=(s,off)=>{
  if(off!==undefined&&s===off)return['Off','']
  if(s<60)return[s,'s']
  if(s<3600){const m=Math.floor(s/60),r=s%60;return r?[`${m} m ${r}`,'s']:[m,'min']}
  if(s<86400)return[s/3600,'h']
  return[s/86400,'d']
}
const make=(id,{title,sub,values,marks,off,start,pct})=>{
  const r=document.getElementById(id)
  r.innerHTML=`<div class="head"><div class="grow"><b>${title}</b><small>${sub}</small></div><div class="ctl"><button class="step" data-d="-1" aria-label="Decrease">−</button><div class="val"></div><button class="step" data-d="1" aria-label="Increase">+</button></div></div>
  <div class="slide"><div class="rail"><div class="fill"></div></div><input type="range" min="0" max="${values.length-1}" step="1" value="${values.indexOf(start)}"><div class="thumb"><div class="bubble"></div></div><div class="marks"></div></div>`
  const input=r.querySelector('input'),slide=r.querySelector('.slide'),val=r.querySelector('.val'),bubble=r.querySelector('.bubble'),marksEl=r.querySelector('.marks'),steps=r.querySelectorAll('.step')
  const n=values.length-1
  const text=v=>{const[a,u]=pct?[v,'%']:fmt(v,off);return[a,u]}
  marks.forEach((m,k)=>{const i=values.indexOf(m),p=i/n,s=document.createElement('span');const[a,u]=text(m);s.textContent=`${a}${u?' '+u:''}`;s.style.left=`calc(var(--thumb)/2 + ${p}*(100% - var(--thumb)))`;if(k==0){s.className='first';s.style.left='0'}if(k==marks.length-1){s.className='last';s.style.left='100%'}marksEl.appendChild(s)})
  const upd=()=>{
    const i=+input.value,v=values[i],[a,u]=text(v)
    slide.style.setProperty('--p',i/n)
    val.innerHTML=`${a}${u?`<em>${u}</em>`:''}`
    bubble.textContent=`${a}${u?' '+u:''}`
    steps[0].disabled=i==0;steps[1].disabled=i==n
  }
  steps.forEach(b=>b.onclick=()=>{input.value=+input.value+ +b.dataset.d;upd()})
  input.addEventListener('input',upd);upd()
}
make('countdown',{title:'Countdown duration',sub:'Wait before the next episode',values:range(0,30,1),marks:[0,5,10,20,30],off:0,start:7})
make('ttl',{title:'Reuse last stream for',sub:'How long a saved stream is still reused',values:[...range(1,24,1).map(h=>h*3600),...range(2,30,1).map(d=>d*86400)],marks:[3600,12*3600,86400,7*86400,30*86400],start:86400})
make('retry',{title:'Retry timeout',sub:'Give up on a source after this long',values:[...range(5,55,5),...range(60,300,15)],marks:[5,30,60,120,300],start:30})
make('watched',{title:'Mark watched at',sub:'Progress needed before an episode counts as watched',values:range(50,100,1),marks:[50,75,100],pct:true,start:80})
</script>
</body>
</html>
