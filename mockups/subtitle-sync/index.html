<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxa Subtitle Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--surface:#141416;--raised:#1C1C1F;--inset:#0D0D0F;--text:#fff;--text2:#B8B8BE;--muted:#8A8A91;--border:#FFFFFF14;--border2:#FFFFFF29;--ok:#4ADE80;--bad:#F87171;--u:1;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--text);font:400 calc(14px*var(--u))/1.4 Archivo,ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{flex:none;width:calc(20px*var(--u));height:calc(20px*var(--u));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.demo{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:#0b0b0c;flex-wrap:wrap;font-size:13px}
.demo b{font-weight:600;margin-right:6px}
.demo .sep{width:1px;height:20px;background:var(--border2);margin:0 6px}
.seg{height:30px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text2);display:inline-flex;align-items:center}
.seg:hover{background:var(--raised)}
.seg.on{background:#fff;color:#000;border-color:#fff}

#stage{flex:1;position:relative;overflow:hidden;background:#000}
#stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000c,#0000 28%,#0000 62%,#000d)}
.sub{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:calc(24px*var(--u));font-weight:600;text-shadow:0 2px 10px #000;padding:0 24px;min-height:1.4em;transition:opacity .12s}

#frame{position:absolute;inset:0;display:flex;z-index:2;pointer-events:none}
#frame>*{pointer-events:auto}
#frame[data-ff=desktop]{align-items:flex-end;justify-content:flex-end;padding:0 28px 84px 0}
#frame[data-ff=phone]{align-items:flex-end;justify-content:center}
#frame[data-ff=tv]{--u:1.35;align-items:center;justify-content:center;background:#000a;pointer-events:auto}

.panel{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000b}
[data-ff=desktop] .panel{width:440px;max-height:100%;border-radius:16px}
[data-ff=phone] .panel{width:min(100%,460px);max-height:92%;border-radius:20px 20px 0 0;border-bottom:0}
[data-ff=phone] .panel::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--border2);margin:10px auto 0}
[data-ff=tv] .panel{width:calc(440px*var(--u));max-height:92%;border-radius:18px}

.head{display:flex;align-items:center;gap:6px;padding:calc(14px*var(--u)) calc(14px*var(--u)) calc(4px*var(--u)) calc(10px*var(--u))}
.ibtn{width:calc(34px*var(--u));height:calc(34px*var(--u));display:grid;place-items:center;border-radius:50%;color:var(--text2)}
.ibtn:hover{background:#ffffff14;color:#fff}
.head h2{flex:1;font-size:calc(16px*var(--u));font-weight:600}
.link{height:calc(30px*var(--u));padding:0 calc(12px*var(--u));border-radius:999px;color:var(--text2);font-size:calc(13px*var(--u));font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.link.on{opacity:1;pointer-events:auto}
.link:hover{background:#ffffff14;color:#fff}

.body{overflow:auto;padding:calc(10px*var(--u)) calc(16px*var(--u)) calc(18px*var(--u));display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}

.strip{position:relative;border-radius:calc(12px*var(--u));background:var(--inset);border:1px solid var(--border);overflow:hidden;touch-action:pan-y;cursor:grab;height:calc(128px*var(--u))}
.strip.drag{cursor:grabbing}
.strip canvas{display:block;width:100%;height:100%}
.tip{font-size:calc(12px*var(--u));color:var(--muted);margin-top:calc(8px*var(--u));text-align:center;transition:opacity .3s,margin .3s,height .3s;height:calc(17px*var(--u));overflow:hidden}
.tip.gone{opacity:0;height:0;margin-top:0}

.reading{display:flex;align-items:center;gap:calc(14px*var(--u));margin-top:calc(14px*var(--u))}
.big{font-size:calc(40px*var(--u));font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.45em;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.state{flex:1;min-width:0;font-size:calc(13px*var(--u));color:var(--text2);display:flex;align-items:center;gap:calc(8px*var(--u))}
.state i{width:calc(8px*var(--u));height:calc(8px*var(--u));border-radius:50%;background:var(--muted);flex:none;transition:background .25s}
.state.ok i{background:var(--ok)}
.state.ok{color:#c9f7d8}
.state.bad i{background:var(--bad)}
.state.bad{color:#fecaca}
.state.busy i{background:#fff;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.stepper{display:flex;border-radius:999px;background:#ffffff14;border:1px solid var(--border);overflow:hidden;flex:none}
.stepper button{height:calc(36px*var(--u));padding:0 calc(14px*var(--u));font-size:calc(13px*var(--u));font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;min-width:calc(52px*var(--u))}
.stepper button+button{border-left:1px solid var(--border)}
.stepper button:hover{background:#ffffff1f}
.stepper button:active{background:#ffffff2e}

.actions{display:flex;gap:calc(10px*var(--u));margin-top:calc(16px*var(--u))}
.pill{height:calc(46px*var(--u));padding:0 calc(20px*var(--u));border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:calc(10px*var(--u));font-weight:600;font-size:calc(15px*var(--u));white-space:nowrap}
.pill.primary{background:#fff;color:#000;flex:1}
.pill.primary:hover{background:#e9e9ec}
.pill.primary:active{transform:scale(.985)}
.pill.ghost{background:#ffffff1a;color:#fff}
.pill.ghost:hover{background:#ffffff29}

.list{margin-top:calc(14px*var(--u));border-top:1px solid var(--border);padding-top:calc(6px*var(--u))}
.row{display:flex;align-items:center;gap:calc(14px*var(--u));width:100%;padding:calc(12px*var(--u)) calc(8px*var(--u));border-radius:calc(12px*var(--u))}
.row:hover{background:#ffffff0d}
.row>svg:first-child{color:var(--text2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:calc(14.5px*var(--u))}
.row .tx span{display:block;font-size:calc(12.5px*var(--u));color:var(--muted);margin-top:1px}
.row .end{color:var(--muted);transition:transform .2s}
.row[aria-expanded=true] .end{transform:rotate(180deg)}

.opts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.opts.on{grid-template-rows:1fr}
.opts>div{overflow:hidden}
.opt{display:flex;align-items:center;width:100%;padding:calc(10px*var(--u)) calc(8px*var(--u)) calc(10px*var(--u)) calc(42px*var(--u));border-radius:calc(10px*var(--u));font-size:calc(14px*var(--u));color:var(--text2)}
.opt:hover{background:#ffffff0d;color:#fff}
.opt.on{background:#ffffff12;color:#fff}
.opt span{flex:1}
.opt svg{color:#fff;opacity:0}
.opt.on svg{opacity:1}

.view[hidden]{display:none}
.lede{font-size:calc(13px*var(--u));color:var(--muted);padding:0 calc(8px*var(--u)) calc(10px*var(--u))}
.line{display:flex;align-items:baseline;gap:calc(14px*var(--u));width:100%;padding:calc(12px*var(--u)) calc(8px*var(--u));border-radius:calc(12px*var(--u))}
.line:hover{background:#ffffff0d}
.line time{width:calc(44px*var(--u));font-size:calc(12px*var(--u));color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.line span{flex:1;font-size:calc(14.5px*var(--u))}

[data-ff=tv] :focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.state.busy i{animation:none}.opts{transition:none}}
</style>
</head>
<body>
<div class="demo">
<b>Subtitle sync</b>
<button class="seg on" data-ff="desktop">Desktop</button>
<button class="seg" data-ff="phone">Phone</button>
<button class="seg" data-ff="tv">TV</button>
<span class="sep"></span>
<button class="seg" id="late">Subtitles 2.4s late</button>
<button class="seg" id="early">Subtitles 1.3s early</button>
<button class="seg" id="fail">Next sync fails</button>
</div>

<div id="stage">
<div class="sub" id="sub"></div>
<div id="frame" data-ff="desktop">
<div class="panel">

<section class="view" id="home">
<div class="head">
<button class="ibtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<h2>Subtitle sync</h2>
<button class="link" id="reset">Reset</button>
</div>
<div class="body">
<div class="strip" id="strip"><canvas id="cv"></canvas></div>
<p class="tip" id="tip">Drag the subtitles to line them up with the voices</p>

<div class="reading">
<div class="big" id="num">+0.0<small>s</small></div>
<div class="state" id="state"><i></i><span id="stateText"></span></div>
<div class="stepper">
<button id="dn" aria-label="0.1 seconds earlier">−0.1</button>
<button id="up" aria-label="0.1 seconds later">+0.1</button>
</div>
</div>

<div class="actions">
<button class="pill primary" id="auto"><svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg>Auto-sync</button>
</div>

<div class="list">
<button class="row" id="match" aria-expanded="false">
<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
<span class="tx"><b>Match another subtitle</b><span>Copy the timing of one that is already right</span></span>
<svg class="end" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
</button>
<div class="opts" id="opts"><div id="optsIn"></div></div>
<button class="row" id="pick">
<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<span class="tx"><b>Pick a line you just heard</b><span>Tell us which subtitle matches the voice</span></span>
<svg class="end" viewBox="0 0 24 24" style="transform:none"><path d="m9 18 6-6-6-6"/></svg>
</button>
</div>
</div>
</section>

<section class="view" id="cuesView" hidden>
<div class="head">
<button class="ibtn" id="cuesBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<h2>Which line was that?</h2>
</div>
<div class="body">
<p class="lede">Pick the subtitle that matches what was just said.</p>
<div id="lines"></div>
</div>
</section>

</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id)
const frame=$('frame'),cv=$('cv'),ctx=cv.getContext('2d'),strip=$('strip')
const lines=['I told you not to open that door.','You never listen to me.','Wait. Do you hear that?','Get behind me. Now.','It was never locked.','Then who locked it from inside?']
const bursts=[[1.2,2.0],[4.4,1.5],[7.0,1.7],[10.2,2.3],[14.0,1.4],[17.2,2.2]]
const PERIOD=21,WINDOW=12,HEAD=0.38
let err=2.4,delay=0,busy=false,failNext=false,t=0,last=performance.now(),dragging=false,touched=false
const still=matchMedia('(prefers-reduced-motion:reduce)').matches

function env(x){
const p=((x%PERIOD)+PERIOD)%PERIOD
for(const [s,l] of bursts){
if(p>=s&&p<=s+l){
const k=(p-s)/l
const shape=Math.sin(k*Math.PI)
return Math.max(.18,shape*(.55+.45*Math.abs(Math.sin(x*23.7)*Math.cos(x*9.1))))
}}
return .08+.04*Math.abs(Math.sin(x*13))
}
function size(){
const r=strip.getBoundingClientRect(),d=devicePixelRatio||1
cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)
ctx.setTransform(d,0,0,d,0,0)
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}

function draw(){
const w=strip.clientWidth,h=strip.clientHeight,u=h/128
ctx.clearRect(0,0,w,h)
const pps=w/WINDOW,hx=w*HEAD
const t0=t-HEAD*WINDOW,t1=t+(1-HEAD)*WINDOW
const waveTop=18*u,waveH=48*u,cueY=82*u,cueH=26*u
const step=.07
for(let x=Math.floor(t0/step)*step;x<t1;x+=step){
const px=hx+(x-t)*pps,a=env(x),bh=Math.max(2,a*waveH)
const past=x<t
ctx.fillStyle=past?'#4a4a52':'#6a6a74'
rr(px,waveTop+waveH/2-bh/2+4*u,Math.max(1.5,pps*step*.62),bh,1.5);ctx.fill()
}
let active=-1
const r=err+delay
for(let k=Math.floor(t0/PERIOD)-1;k<=Math.ceil(t1/PERIOD);k++){
bursts.forEach(([s,l],i)=>{
const start=k*PERIOD+s
const gx=hx+(start+err-t)*pps
if(Math.abs(delay)>.05){
ctx.setLineDash([4,3]);ctx.strokeStyle='#ffffff55';ctx.lineWidth=1
rr(gx+.5,cueY+.5,l*pps-1,cueH-1,6);ctx.stroke();ctx.setLineDash([])
}
const cx=hx+(start+r-t)*pps
const inSync=Math.abs(r)<.15
ctx.fillStyle=inSync?'#ffffff':'#e9e9ec'
rr(cx,cueY,l*pps,cueH,6);ctx.fill()
if(t>=start+r&&t<=start+r+l)active=i
})}
ctx.font=`500 ${10.5*u}px Archivo,system-ui,sans-serif`
ctx.textBaseline='top'
for(const [name,y] of [['Voices',6*u],['Subtitles',cueY-17*u]]){
const tw=ctx.measureText(name).width
ctx.fillStyle='#0D0D0Fe6';ctx.fillRect(6,y-2,tw+12,15*u)
ctx.fillStyle='#8A8A91';ctx.fillText(name,12,y)
}
ctx.fillStyle='#fff'
ctx.fillRect(hx-.75,10*u,1.5,h-20*u)
ctx.beginPath();ctx.moveTo(hx-5,8*u);ctx.lineTo(hx+5,8*u);ctx.lineTo(hx,14*u);ctx.closePath();ctx.fill()
$('sub').textContent=active>=0?lines[active]:''
}

function fmt(v){return (v>=0?'+':'−')+Math.abs(v).toFixed(1)}
function status(kind,text){
$('state').className='state '+kind
$('stateText').textContent=text
}
function refresh(){
$('num').innerHTML=fmt(delay)+'<small>s</small>'
$('reset').classList.toggle('on',Math.abs(delay)>.05)
if(busy)return
const r=err+delay
if(Math.abs(r)<.15)status('ok','In sync')
else status('',`Subtitles are ${Math.abs(r).toFixed(1)}s ${r>0?'late':'early'}`)
}
function setDelay(v){delay=Math.round(v*10)/10;refresh()}

function tween(to,ms,done){
const from=delay,start=performance.now()
const f=now=>{
const k=Math.min(1,(now-start)/ms),e=1-Math.pow(1-k,3)
delay=from+(to-from)*e
$('num').innerHTML=fmt(Math.round(delay*10)/10)+'<small>s</small>'
if(k<1)requestAnimationFrame(f);else{setDelay(to);done&&done()}
}
requestAnimationFrame(f)
}
function run(label){
if(busy)return
busy=true
status('busy','Listening to the dialogue…')
setTimeout(()=>{
if(failNext){failNext=false;$('fail').classList.remove('on');busy=false;status('bad','No match found. Try matching another subtitle.');return}
tween(Math.round(-err*10)/10,1100,()=>{
busy=false;refresh()
status('ok',label?`In sync with ${label}`:'In sync')
})
},1000)
}

$('dn').onclick=()=>{setDelay(delay-.1)}
$('up').onclick=()=>{setDelay(delay+.1)}
function hold(btn,dir){
let to,iv
btn.addEventListener('pointerdown',()=>{to=setTimeout(()=>{iv=setInterval(()=>setDelay(delay+dir*.1),70)},420)})
for(const e of['pointerup','pointerleave','pointercancel'])btn.addEventListener(e,()=>{clearTimeout(to);clearInterval(iv)})
}
hold($('dn'),-1);hold($('up'),1)
$('reset').onclick=()=>setDelay(0)
$('auto').onclick=()=>run()
$('late').onclick=()=>{err=2.4;setDelay(0)}
$('early').onclick=()=>{err=-1.3;setDelay(0)}
$('fail').onclick=e=>{failNext=!failNext;e.currentTarget.classList.toggle('on',failNext)}

let sx=0,sd=0
strip.addEventListener('pointerdown',e=>{if(busy)return;dragging=true;sx=e.clientX;sd=delay;strip.classList.add('drag');strip.setPointerCapture(e.pointerId);if(!touched){touched=true;$('tip').classList.add('gone')}})
strip.addEventListener('pointermove',e=>{if(!dragging)return;setDelay(sd+(e.clientX-sx)/(strip.clientWidth/WINDOW))})
for(const ev of['pointerup','pointercancel'])strip.addEventListener(ev,()=>{dragging=false;strip.classList.remove('drag')})
document.addEventListener('keydown',e=>{
if(e.target.closest&&e.target.closest('button')&&e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return
if(e.key==='ArrowLeft')setDelay(delay-.1)
if(e.key==='ArrowRight')setDelay(delay+.1)
})

const langs=['Turkish 1','Turkish 2','Portuguese','Korean','Arabic 1','Arabic 2']
$('optsIn').innerHTML=langs.map(n=>`<button class="opt"><span>${n}</span><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>`).join('')
$('match').onclick=()=>{
const on=$('opts').classList.toggle('on')
$('match').setAttribute('aria-expanded',on)
}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))
run(b.textContent.trim())
})

const times=['12:04','12:09','12:15','12:21','12:30','12:37']
$('lines').innerHTML=lines.map((x,i)=>`<button class="line" data-i="${i}"><time>${times[i]}</time><span>${x}</span></button>`).join('')
$('pick').onclick=()=>{$('home').hidden=true;$('cuesView').hidden=false}
$('cuesBack').onclick=()=>{$('cuesView').hidden=true;$('home').hidden=false;size()}
document.querySelectorAll('.line').forEach(b=>b.onclick=()=>{
$('cuesView').hidden=true;$('home').hidden=false;size()
busy=true;status('busy','Aligning…')
tween(Math.round(-err*10)/10,900,()=>{busy=false;refresh();status('ok','In sync')})
})

document.querySelectorAll('.demo [data-ff]').forEach(b=>b.onclick=()=>{
document.querySelectorAll('.demo [data-ff]').forEach(x=>x.classList.toggle('on',x===b))
frame.dataset.ff=b.dataset.ff
requestAnimationFrame(size)
})

new ResizeObserver(size).observe(strip)
function frameLoop(now){
const dt=(now-last)/1000;last=now
if(!still&&!document.hidden)t+=dt
if(still)t=4.6
draw()
requestAnimationFrame(frameLoop)
}
size();refresh()
requestAnimationFrame(frameLoop)
</script>
</body>
</html>
