<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxa Player Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--surface:#141416;--raised:#1C1C1F;--inset:#0D0D0F;--text:#fff;--text2:#B8B8BE;--muted:#8A8A91;--border:#FFFFFF14;--border2:#FFFFFF29;--ok:#4ADE80;--bad:#F87171;--u:1;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--text);font:400 calc(14px*var(--u))/1.4 Archivo,ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{flex:none;width:calc(24px*var(--u));height:calc(24px*var(--u));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
svg.off{display:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.demo{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:#0b0b0c;flex-wrap:wrap;font-size:13px;z-index:20}
.demo b{font-weight:600;margin-right:6px}
.demo .sep{width:1px;height:20px;background:var(--border2);margin:0 6px}
.seg{height:30px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text2);display:inline-flex;align-items:center}
.seg:hover{background:var(--raised)}
.seg.on{background:#fff;color:#000;border-color:#fff}

#player{flex:1;position:relative;overflow:hidden;background:#000;cursor:default}
#player.idle{cursor:none}
.scene{position:absolute;inset:0;background:
radial-gradient(60% 70% at 72% 38%,#3a2c1c 0%,#0000 70%),
radial-gradient(70% 60% at 18% 78%,#12262c 0%,#0000 70%),
linear-gradient(180deg,#0b0d12,#07080a)}
.scene::after{content:"";position:absolute;left:50%;top:22%;width:18%;height:56%;border-radius:40% 40% 8% 8%;background:linear-gradient(180deg,#0000,#00000060);transform:translateX(-30%);filter:blur(30px)}

.sub{position:absolute;left:0;right:0;bottom:calc(16% + 12px);text-align:center;font-size:calc(26px*var(--u));font-weight:600;text-shadow:0 2px 12px #000,0 0 3px #000;padding:0 8%;min-height:1.4em;z-index:3;transition:bottom .3s ease;pointer-events:none}
#player.idle .sub,#player.panel-open .sub{bottom:calc(10% + 12px)}

.ui{position:absolute;inset:0;z-index:5;transition:opacity .35s ease;pointer-events:none}
.ui>*{pointer-events:auto}
#player.idle .ui{opacity:0}
.scrim-t,.scrim-b{position:absolute;left:0;right:0;pointer-events:none!important}
.scrim-t{top:0;height:150px;background:linear-gradient(180deg,#000c,#0000)}
.scrim-b{bottom:0;height:230px;background:linear-gradient(0deg,#000e,#0000)}

.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:calc(16px*var(--u));padding:calc(22px*var(--u)) calc(44px*var(--u)) 0}
.ib{width:calc(44px*var(--u));height:calc(44px*var(--u));display:grid;place-items:center;border-radius:50%;color:#fff;opacity:.9;transition:background .15s,opacity .15s}
.ib:hover{background:#ffffff1f;opacity:1}
.ib.on{background:#ffffff26;opacity:1}
.title b{display:block;font-size:calc(17px*var(--u));font-weight:700;letter-spacing:-.01em}
.title span{display:block;font-size:calc(12.5px*var(--u));color:var(--text2);margin-top:1px}
.grow{flex:1}

.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(44px*var(--u)) calc(20px*var(--u))}
.bar{position:relative;height:calc(22px*var(--u));display:flex;align-items:center;cursor:pointer}
.bar .tr{position:relative;flex:1;height:4px;border-radius:2px;background:#ffffff40;transition:height .12s}
.bar:hover .tr{height:6px}
.bar .buf{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#ffffff47;width:41%}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.bar .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;translate:-50% -50%;scale:0;transition:scale .12s}
.bar:hover .dot{scale:1}
.row{display:flex;align-items:center;gap:calc(4px*var(--u));margin-top:calc(4px*var(--u))}
.clock{font-size:calc(13px*var(--u));font-weight:600;font-variant-numeric:tabular-nums;margin:0 calc(12px*var(--u)) 0 calc(8px*var(--u));white-space:nowrap}
.clock em{font-style:normal;color:var(--text2);font-weight:500;margin-left:8px}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:#fff;height:4px}
.vol:hover input,.vol:focus-within input{width:84px;opacity:1;margin-right:8px}

.pop{position:absolute;right:calc(44px*var(--u));bottom:calc(92px*var(--u));display:none;z-index:8}
.pop.on{display:block;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;translate:0 8px}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:calc(16px*var(--u));box-shadow:0 20px 60px #000b;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.tracks{width:calc(560px*var(--u));padding:calc(14px*var(--u))}
.cols{display:grid;grid-template-columns:1fr 1.15fr;gap:calc(14px*var(--u))}
.cols h3{font-size:calc(12.5px*var(--u));font-weight:600;color:var(--muted);padding:calc(4px*var(--u)) calc(10px*var(--u)) calc(8px*var(--u))}
.tr-row{display:flex;align-items:center;gap:calc(10px*var(--u));width:100%;padding:calc(11px*var(--u)) calc(12px*var(--u));border-radius:calc(12px*var(--u));font-weight:600;font-size:calc(14.5px*var(--u))}
.tr-row:hover{background:#ffffff0d}
.tr-row.sel{background:#ffffff12}
.tr-row .nm{flex:1;min-width:0}
.tr-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.84em;margin-top:1px}
.tr-row .ck{width:calc(18px*var(--u));height:calc(18px*var(--u));opacity:0}
.tr-row.sel .ck{opacity:1}
.tr-row .ct{color:var(--muted);font-weight:500;font-size:.86em}
.tr-row.plain{font-weight:600}
.cols .scroll{max-height:calc(100vh - 290px);overflow:auto}
.cols .scroll::-webkit-scrollbar{width:0}
.divider{height:1px;background:var(--border);margin:calc(6px*var(--u)) calc(6px*var(--u))}

.sync{width:calc(440px*var(--u))}
.head{display:flex;align-items:center;gap:6px;padding:calc(14px*var(--u)) calc(14px*var(--u)) calc(4px*var(--u)) calc(10px*var(--u))}
.head .ib{width:calc(34px*var(--u));height:calc(34px*var(--u));color:var(--text2)}
.head .ib svg{width:calc(20px*var(--u));height:calc(20px*var(--u))}
.head h2{flex:1;font-size:calc(16px*var(--u));font-weight:600}
.link{height:calc(30px*var(--u));padding:0 calc(12px*var(--u));border-radius:999px;color:var(--text2);font-size:calc(13px*var(--u));font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.link.on{opacity:1;pointer-events:auto}
.link:hover{background:#ffffff14;color:#fff}
.body{overflow:auto;padding:calc(10px*var(--u)) calc(16px*var(--u)) calc(18px*var(--u));display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}

.strip{position:relative;border-radius:calc(12px*var(--u));background:var(--inset);border:1px solid var(--border);overflow:hidden;touch-action:pan-y;cursor:grab;height:calc(128px*var(--u));flex:none}
.strip.drag{cursor:grabbing}
.strip canvas{position:absolute;inset:0;width:100%;height:100%}
.tip{font-size:calc(12px*var(--u));color:var(--muted);margin-top:calc(8px*var(--u));text-align:center;transition:opacity .3s,margin .3s,height .3s;height:calc(17px*var(--u));overflow:hidden}
.tip.gone{opacity:0;height:0;margin-top:0}
.reading{display:flex;align-items:center;gap:calc(14px*var(--u));margin-top:calc(14px*var(--u))}
.big{font-size:calc(40px*var(--u));font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.45em;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.state{flex:1;min-width:0;font-size:calc(13px*var(--u));color:var(--text2);display:flex;align-items:center;gap:calc(8px*var(--u))}
.state i{width:calc(8px*var(--u));height:calc(8px*var(--u));border-radius:50%;background:var(--muted);flex:none;transition:background .25s}
.state.ok i{background:var(--ok)}
.state.ok{color:#c9f7d8}
.state.bad i{background:var(--bad)}
.state.bad{color:#fecaca}
.state.busy i{background:#fff;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.stepper{display:flex;border-radius:999px;background:#ffffff14;border:1px solid var(--border);overflow:hidden;flex:none}
.stepper button{height:calc(36px*var(--u));padding:0 calc(14px*var(--u));font-size:calc(13px*var(--u));font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;min-width:calc(52px*var(--u))}
.stepper button+button{border-left:1px solid var(--border)}
.stepper button:hover{background:#ffffff1f}
.stepper button:active{background:#ffffff2e}
.pill{height:calc(46px*var(--u));padding:0 calc(20px*var(--u));border-radius:999px;display:flex;align-items:center;justify-content:center;gap:calc(10px*var(--u));font-weight:600;font-size:calc(15px*var(--u));white-space:nowrap;margin-top:calc(16px*var(--u));background:#fff;color:#000;width:100%}
.pill svg{width:calc(20px*var(--u));height:calc(20px*var(--u))}
.pill:hover{background:#e9e9ec}
.pill:active{transform:scale(.985)}
.list{margin-top:calc(14px*var(--u));border-top:1px solid var(--border);padding-top:calc(6px*var(--u))}
.opt-row{display:flex;align-items:center;gap:calc(14px*var(--u));width:100%;padding:calc(12px*var(--u)) calc(8px*var(--u));border-radius:calc(12px*var(--u))}
.opt-row:hover{background:#ffffff0d}
.opt-row>svg:first-child{width:calc(20px*var(--u));height:calc(20px*var(--u));color:var(--text2)}
.opt-row .tx{flex:1;min-width:0}
.opt-row .tx b{display:block;font-weight:600;font-size:calc(14.5px*var(--u))}
.opt-row .tx span{display:block;font-size:calc(12.5px*var(--u));color:var(--muted);margin-top:1px}
.opt-row .end{width:calc(20px*var(--u));height:calc(20px*var(--u));color:var(--muted);transition:transform .2s}
.opt-row[aria-expanded=true] .end{transform:rotate(180deg)}
.opts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.opts.on{grid-template-rows:1fr}
.opts>div{overflow:hidden}
.opt{display:flex;align-items:center;width:100%;padding:calc(10px*var(--u)) calc(8px*var(--u)) calc(10px*var(--u)) calc(42px*var(--u));border-radius:calc(10px*var(--u));font-size:calc(14px*var(--u));color:var(--text2)}
.opt:hover{background:#ffffff0d;color:#fff}
.opt.on{background:#ffffff12;color:#fff}
.opt span{flex:1}
.opt svg{width:calc(18px*var(--u));height:calc(18px*var(--u));color:#fff;opacity:0}
.opt.on svg{opacity:1}
.sub-view[hidden]{display:none}
.lede{font-size:calc(13px*var(--u));color:var(--muted);padding:0 calc(8px*var(--u)) calc(10px*var(--u))}
.line{display:flex;align-items:baseline;gap:calc(14px*var(--u));width:100%;padding:calc(12px*var(--u)) calc(8px*var(--u));border-radius:calc(12px*var(--u))}
.line:hover{background:#ffffff0d}
.line time{width:calc(44px*var(--u));font-size:calc(12px*var(--u));color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.line span{flex:1;font-size:calc(14.5px*var(--u))}

#player[data-ff=phone]{--u:.94}
#player[data-ff=phone] .top{padding:14px 14px 0}
#player[data-ff=phone] .bottom{padding:0 16px 14px}
#player[data-ff=phone] .hide-phone,#player[data-ff=phone] .vol{display:none}
#player[data-ff=phone] .pop{left:0;right:0;bottom:0;display:none;align-items:flex-end;justify-content:center;top:0;background:#0009}
#player[data-ff=phone] .pop.on{display:flex}
#player[data-ff=phone] .panel{width:100%;border-radius:20px 20px 0 0;max-height:88%;border-bottom:0}
#player[data-ff=phone] .tracks,#player[data-ff=phone] .sync{width:100%}
#player[data-ff=phone] .cols .scroll{max-height:42vh}
#player[data-ff=tv]{--u:1.3}
#player[data-ff=tv] .top,#player[data-ff=tv] .bottom{padding-left:6%;padding-right:6%}
#player[data-ff=tv] .hide-tv,#player[data-ff=tv] .vol{display:none}
#player[data-ff=tv] .pop{inset:0;right:0;bottom:0;display:none;place-items:center;background:#000a}
#player[data-ff=tv] .pop.on{display:grid}
#player[data-ff=tv] :focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.pop.on{animation:none}.ui{transition:none}.state.busy i{animation:none}}
</style>
</head>
<body>
<div class="demo">
<b>Player overlay</b>
<button class="seg on" data-ff="desktop">Desktop</button>
<button class="seg" data-ff="phone">Phone</button>
<button class="seg" data-ff="tv">TV</button>
<span class="sep"></span>
<button class="seg" id="late">Subtitles 2.4s late</button>
<button class="seg" id="early">Subtitles 1.3s early</button>
<button class="seg" id="fail">Next sync fails</button>
</div>

<div id="player" data-ff="desktop">
<div class="scene"></div>
<div class="sub" id="sub"></div>

<div class="ui" id="ui">
<div class="scrim-t"></div><div class="scrim-b"></div>

<div class="top">
<button class="ib" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg></button>
<div class="title"><b>Beyond the Lighthouse</b><span>S1 · E4 Low Pressure</span></div>
<span class="grow"></span>
<button class="ib hide-phone" aria-label="Watch together"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
<button class="ib" aria-label="Cast"><svg viewBox="0 0 24 24"><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6M2 12a9 9 0 0 1 8 8M2 16a5 5 0 0 1 4 4M2 20h.01"/></svg></button>
</div>

<div class="bottom">
<div class="bar" id="bar"><div class="tr"><div class="buf"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div></div>
<div class="row">
<button class="ib" id="play" aria-label="Pause"><svg class="fill" id="icoPause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg><svg class="fill off" id="icoPlay" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></button>
<button class="ib hide-phone" aria-label="Next episode"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
<div class="vol hide-phone hide-tv"><button class="ib" aria-label="Volume"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button><input type="range" min="0" max="100" value="80" aria-label="Volume level"></div>
<div class="clock"><span id="clock">12:34 / 45:12</span><em>Storm</em></div>
<span class="grow"></span>
<button class="ib" id="tracksBtn" aria-label="Audio and subtitles"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM8 9h8M8 13h5"/></svg></button>
<button class="ib" aria-label="Speed"><svg viewBox="0 0 24 24"><path d="m12 14 4-4M3.34 19a10 10 0 1 1 17.32 0"/></svg></button>
<button class="ib hide-phone" aria-label="Episodes"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h7M16 14l5 3-5 3z"/></svg></button>
<button class="ib hide-phone hide-tv" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
<button class="ib hide-phone hide-tv" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
</div>
</div>

<div class="pop" id="popTracks"><div class="panel tracks">
<div class="cols">
<div><h3>Audio</h3>
<button class="tr-row sel"><span class="nm">Audio 1<small>Stereo · AAC</small></span><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
</div>
<div><h3>Subtitles</h3>
<div class="scroll" id="subList"></div>
<div class="divider"></div>
<button class="tr-row plain"><span class="nm">Subtitle style</span><svg class="ck" style="opacity:1;color:var(--muted)" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
<button class="tr-row plain" id="openSync"><span class="nm">Subtitle sync</span><span class="ct" id="syncVal"></span><svg class="ck" style="opacity:1;color:var(--muted)" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
</div>
</div></div>

<div class="pop" id="popSync"><div class="panel sync">
<div class="sub-view" id="home">
<div class="head">
<button class="ib" id="syncBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<h2>Subtitle sync</h2>
<button class="link" id="reset">Reset</button>
</div>
<div class="body">
<div class="strip" id="strip"><canvas id="cv"></canvas></div>
<p class="tip" id="tip">Drag the subtitles to line them up with the voices</p>
<div class="reading">
<div class="big" id="num">+0.0<small>s</small></div>
<div class="state" id="state"><i></i><span id="stateText"></span></div>
<div class="stepper"><button id="dn" aria-label="0.1 seconds earlier">−0.1</button><button id="up" aria-label="0.1 seconds later">+0.1</button></div>
</div>
<button class="pill" id="auto"><svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg>Auto-sync</button>
<div class="list">
<button class="opt-row" id="match" aria-expanded="false">
<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
<span class="tx"><b>Match another subtitle</b><span>Copy the timing of one that is already right</span></span>
<svg class="end" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
</button>
<div class="opts" id="opts"><div id="optsIn"></div></div>
<button class="opt-row" id="pick">
<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
<span class="tx"><b>Pick a line you just heard</b><span>Tell us which subtitle matches the voice</span></span>
<svg class="end" viewBox="0 0 24 24" style="transform:none"><path d="m9 18 6-6-6-6"/></svg>
</button>
</div>
</div>
</div>
<div class="sub-view" id="cuesView" hidden>
<div class="head">
<button class="ib" id="cuesBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<h2>Which line was that?</h2>
</div>
<div class="body"><p class="lede">Pick the subtitle that matches what was just said.</p><div id="lines"></div></div>
</div>
</div></div>

</div>
</div>

<script>
const $=id=>document.getElementById(id)
const player=$('player'),cv=$('cv'),ctx=cv.getContext('2d'),strip=$('strip')
const lines=['I told you not to open that door.','You never listen to me.','Wait. Do you hear that?','Get behind me. Now.','It was never locked.','Then who locked it from inside?']
const bursts=[[1.2,2.0],[4.4,1.5],[7.0,1.7],[10.2,2.3],[14.0,1.4],[17.2,2.2]]
const PERIOD=21,WINDOW=12,HEAD=0.38,TOTAL=2712
let err=2.4,delay=0,busy=false,failNext=false,vt=754,last=performance.now(),dragging=false,touched=false,playing=true,subOn=true,idleTimer
const still=matchMedia('(prefers-reduced-motion:reduce)').matches

function env(x){
const p=((x%PERIOD)+PERIOD)%PERIOD
for(const [s,l] of bursts){
if(p>=s&&p<=s+l){
const k=(p-s)/l,shape=Math.sin(k*Math.PI)
return Math.max(.18,shape*(.55+.45*Math.abs(Math.sin(x*23.7)*Math.cos(x*9.1))))
}}
return .08+.04*Math.abs(Math.sin(x*13))
}
function size(){
const r=strip.getBoundingClientRect(),d=devicePixelRatio||1
if(!r.width)return
cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)
ctx.setTransform(d,0,0,d,0,0)
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function drawStrip(t){
const w=strip.clientWidth,h=strip.clientHeight
if(!w)return
const u=h/128
ctx.clearRect(0,0,w,h)
const pps=w/WINDOW,hx=w*HEAD
const t0=t-HEAD*WINDOW,t1=t+(1-HEAD)*WINDOW
const waveTop=18*u,waveH=48*u,cueY=82*u,cueH=26*u
const step=.07
for(let x=Math.floor(t0/step)*step;x<t1;x+=step){
const px=hx+(x-t)*pps,a=env(x),bh=Math.max(2,a*waveH)
ctx.fillStyle=x<t?'#4a4a52':'#6a6a74'
rr(px,waveTop+waveH/2-bh/2+4*u,Math.max(1.5,pps*step*.62),bh,1.5);ctx.fill()
}
const r=err+delay
for(let k=Math.floor(t0/PERIOD)-1;k<=Math.ceil(t1/PERIOD);k++){
bursts.forEach(([s,l])=>{
const start=k*PERIOD+s
if(Math.abs(delay)>.05){
const gx=hx+(start+err-t)*pps
ctx.setLineDash([4,3]);ctx.strokeStyle='#ffffff55';ctx.lineWidth=1
rr(gx+.5,cueY+.5,l*pps-1,cueH-1,6);ctx.stroke();ctx.setLineDash([])
}
ctx.fillStyle=Math.abs(r)<.15?'#ffffff':'#e9e9ec'
rr(hx+(start+r-t)*pps,cueY,l*pps,cueH,6);ctx.fill()
})}
ctx.font=`500 ${10.5*u}px Archivo,system-ui,sans-serif`
ctx.textBaseline='top'
for(const [name,y] of [['Voices',6*u],['Subtitles',cueY-17*u]]){
const tw=ctx.measureText(name).width
ctx.fillStyle='#0D0D0Fe6';ctx.fillRect(6,y-2,tw+12,15*u)
ctx.fillStyle='#8A8A91';ctx.fillText(name,12,y)
}
ctx.fillStyle='#fff'
ctx.fillRect(hx-.75,10*u,1.5,h-20*u)
ctx.beginPath();ctx.moveTo(hx-5,8*u);ctx.lineTo(hx+5,8*u);ctx.lineTo(hx,14*u);ctx.closePath();ctx.fill()
}
function activeLine(t){
const r=err+delay,p=((t%PERIOD)+PERIOD)%PERIOD
for(let i=0;i<bursts.length;i++){
const [s,l]=bursts[i]
const q=((p-(s+r))%PERIOD+PERIOD)%PERIOD
if(q<=l)return i
}
return -1
}

function mmss(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmt(v){return (v>=0?'+':'−')+Math.abs(v).toFixed(1)}
function status(kind,text){$('state').className='state '+kind;$('stateText').textContent=text}
function refresh(){
$('num').innerHTML=fmt(delay)+'<small>s</small>'
$('reset').classList.toggle('on',Math.abs(delay)>.05)
$('syncVal').textContent=Math.abs(delay)>.05?fmt(delay)+'s':''
if(busy)return
const r=err+delay
if(Math.abs(r)<.15)status('ok','In sync')
else status('',`Subtitles are ${Math.abs(r).toFixed(1)}s ${r>0?'late':'early'}`)
}
function setDelay(v){delay=Math.round(v*10)/10;refresh()}
function tween(to,ms,done){
const from=delay,start=performance.now()
const f=now=>{
const k=Math.min(1,(now-start)/ms),e=1-Math.pow(1-k,3)
delay=from+(to-from)*e
$('num').innerHTML=fmt(Math.round(delay*10)/10)+'<small>s</small>'
if(k<1)requestAnimationFrame(f);else{setDelay(to);done&&done()}
}
requestAnimationFrame(f)
}
function run(label){
if(busy)return
busy=true
status('busy','Listening to the dialogue…')
setTimeout(()=>{
if(failNext){failNext=false;$('fail').classList.remove('on');busy=false;status('bad','No match found. Try matching another subtitle.');return}
tween(Math.round(-err*10)/10,1100,()=>{busy=false;refresh();status('ok',label?`In sync with ${label}`:'In sync')})
},1000)
}

$('dn').onclick=()=>setDelay(delay-.1)
$('up').onclick=()=>setDelay(delay+.1)
function hold(btn,dir){
let to,iv
btn.addEventListener('pointerdown',()=>{to=setTimeout(()=>{iv=setInterval(()=>setDelay(delay+dir*.1),70)},420)})
for(const e of['pointerup','pointerleave','pointercancel'])btn.addEventListener(e,()=>{clearTimeout(to);clearInterval(iv)})
}
hold($('dn'),-1);hold($('up'),1)
$('reset').onclick=()=>setDelay(0)
$('auto').onclick=()=>run()
$('late').onclick=()=>{err=2.4;setDelay(0)}
$('early').onclick=()=>{err=-1.3;setDelay(0)}
$('fail').onclick=e=>{failNext=!failNext;e.currentTarget.classList.toggle('on',failNext)}

let sx=0,sd=0
strip.addEventListener('pointerdown',e=>{if(busy)return;dragging=true;sx=e.clientX;sd=delay;strip.classList.add('drag');strip.setPointerCapture(e.pointerId);if(!touched){touched=true;$('tip').classList.add('gone')}})
strip.addEventListener('pointermove',e=>{if(dragging)setDelay(sd+(e.clientX-sx)/(strip.clientWidth/WINDOW))})
for(const ev of['pointerup','pointercancel'])strip.addEventListener(ev,()=>{dragging=false;strip.classList.remove('drag')})

const langs=['Turkish 1','Turkish 2','Portuguese','Korean','Arabic 1','Arabic 2']
$('optsIn').innerHTML=langs.map(n=>`<button class="opt"><span>${n}</span><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>`).join('')
$('match').onclick=()=>{const on=$('opts').classList.toggle('on');$('match').setAttribute('aria-expanded',on)}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))
run(b.textContent.trim())
})
const times=['12:04','12:09','12:15','12:21','12:30','12:37']
$('lines').innerHTML=lines.map((x,i)=>`<button class="line"><time>${times[i]}</time><span>${x}</span></button>`).join('')
$('pick').onclick=()=>{$('home').hidden=true;$('cuesView').hidden=false}
$('cuesBack').onclick=()=>{$('cuesView').hidden=true;$('home').hidden=false;size()}
document.querySelectorAll('.line').forEach(b=>b.onclick=()=>{
$('cuesView').hidden=true;$('home').hidden=false;size()
busy=true;status('busy','Aligning…')
tween(Math.round(-err*10)/10,900,()=>{busy=false;refresh();status('ok','In sync')})
})

const subs=[['Off',''],['English','1'],['Portuguese','1'],['Spanish','1'],['French','1'],['German','1'],['Turkish','2']]
let subSel=1
function renderSubs(){
$('subList').innerHTML=subs.map(([n,c],i)=>`<button class="tr-row ${i===subSel?'sel':''}" data-i="${i}"><span class="nm">${n}</span><span class="ct">${c}</span><svg class="ck" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>`).join('')
$('subList').querySelectorAll('.tr-row').forEach(b=>b.onclick=()=>{subSel=+b.dataset.i;subOn=subSel>0;renderSubs()})
}
renderSubs()

function openPop(which){
$('popTracks').classList.toggle('on',which==='tracks')
$('popSync').classList.toggle('on',which==='sync')
$('tracksBtn').classList.toggle('on',!!which)
player.classList.toggle('panel-open',!!which)
if(which==='sync')requestAnimationFrame(size)
wake()
}
$('tracksBtn').onclick=()=>openPop($('popTracks').classList.contains('on')||$('popSync').classList.contains('on')?null:'tracks')
$('openSync').onclick=()=>openPop('sync')
$('syncBack').onclick=()=>openPop('tracks')
document.addEventListener('keydown',e=>{
wake()
if(e.key==='Escape'){
if(!$('cuesView').hidden){$('cuesBack').click()}
else if($('popSync').classList.contains('on'))openPop('tracks')
else openPop(null)
}
if($('popSync').classList.contains('on')&&!e.target.closest('button,input')){
if(e.key==='ArrowLeft')setDelay(delay-.1)
if(e.key==='ArrowRight')setDelay(delay+.1)
}
if(e.key===' '&&!e.target.closest('button,input')){e.preventDefault();toggle()}
})
player.addEventListener('pointerdown',e=>{
if(player.dataset.ff==='desktop'&&!e.target.closest('.panel,#tracksBtn')&&(e.target.closest('.pop')===null)&&($('popTracks').classList.contains('on')||$('popSync').classList.contains('on')))openPop(null)
if(player.dataset.ff!=='desktop'&&e.target.classList.contains('pop'))openPop(null)
})

function toggle(){
playing=!playing
$('icoPause').classList.toggle('off',!playing);$('icoPlay').classList.toggle('off',playing)
$('play').setAttribute('aria-label',playing?'Pause':'Play')
}
$('play').onclick=toggle
$('bar').addEventListener('pointerdown',e=>{
const r=$('bar').getBoundingClientRect()
vt=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL
})

function wake(){
player.classList.remove('idle')
clearTimeout(idleTimer)
idleTimer=setTimeout(()=>{
if(!$('popTracks').classList.contains('on')&&!$('popSync').classList.contains('on')&&playing)player.classList.add('idle')
},3200)
}
player.addEventListener('pointermove',wake)
player.addEventListener('pointerdown',wake)

document.querySelectorAll('.demo [data-ff]').forEach(b=>b.onclick=()=>{
document.querySelectorAll('.demo [data-ff]').forEach(x=>x.classList.toggle('on',x===b))
player.dataset.ff=b.dataset.ff
requestAnimationFrame(size)
})

new ResizeObserver(size).observe(strip)
function loop(now){
const dt=(now-last)/1000;last=now
if(playing&&!still&&!document.hidden)vt=Math.min(TOTAL,vt+dt)
const pct=vt/TOTAL*100
$('fill').style.width=pct+'%';$('dot').style.left=pct+'%'
$('clock').textContent=mmss(vt)+' / '+mmss(TOTAL)
const i=activeLine(vt)
$('sub').textContent=subOn&&i>=0?lines[i]:''
if($('popSync').classList.contains('on'))drawStrip(vt)
requestAnimationFrame(loop)
}
size();refresh();wake()
requestAnimationFrame(loop)
</script>
</body>
</html>
