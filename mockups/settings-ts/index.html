<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fluxa Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-view="list">
<div class="app">
  <aside class="side">
    <div class="side-top">
      <h1 class="side-title">Settings</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Find a setting" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <nav id="rail-list" class="side-nav" aria-label="Settings"></nav>
  </aside>
  <main class="main">
    <header class="bar">
      <button id="back" class="icon-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <span id="bar-title" class="bar-title"></span>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>
<script src="dist/main.js"></script>
</body>
</html>
