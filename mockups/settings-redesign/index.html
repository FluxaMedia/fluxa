<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxa Settings Redesign</title>
<style>
:root{--bg:#060606;--surface:#141416;--raised:#1C1C1F;--hi:#26262A;--text:#fff;--text2:#B8B8BE;--muted:#8A8A91;--border:#FFFFFF14;--border2:#FFFFFF29;--accent:#8B5CF6;--danger:#F87171;--ok:#4ADE80;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{flex:none}

.demo{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border);background:#0b0b0c;flex-wrap:wrap}
.demo .hint{color:var(--muted);font-size:13px;margin-left:auto}
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(1000px 520px at 15% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%),#000}
#frame{position:absolute;left:50%;top:50%;translate:-50% -50%;background:var(--bg);overflow:hidden;display:flex;transform-origin:center}
#frame[data-ff=desktop].boxed{border-radius:14px;border:1px solid var(--border2)}
#frame[data-ff=phone]{flex-direction:column;border-radius:46px;box-shadow:0 0 0 10px #17171a,0 0 0 11px #2c2c30,0 30px 80px #000}
#frame[data-ff=tv]{border-radius:6px;box-shadow:0 0 0 14px #0e0e10,0 40px 100px #000}
#frame.fill{border-radius:0!important;box-shadow:none!important;border:0!important}

.side{width:268px;flex:none;display:flex;flex-direction:column;gap:14px;padding:22px 14px;border-right:1px solid var(--border);background:linear-gradient(180deg,#0d0d10,#08080a)}
.acct{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;text-align:left;width:100%}
.acct:hover{background:var(--surface)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#F472B6);display:grid;place-items:center;font-weight:700;flex:none}
.acct .n{font-weight:600}
.acct .s{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.search:focus-within{border-color:var(--border2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;margin:0 -4px;padding:0 4px}
.ni{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 14px;border-radius:999px;color:var(--text2);text-align:left;width:100%}
.ni:hover{background:var(--surface);color:var(--text)}
.ni.on{background:var(--raised);color:var(--text)}
.ni.on svg{color:var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 14px;display:flex;justify-content:space-between}
.main{flex:1;overflow:auto;padding:40px 48px 80px;position:relative}
.col{max-width:780px;margin:0 auto}
.ph h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:4px}
.grp{margin-top:28px}
.grp h2{font-size:13px;font-weight:600;color:var(--text2);margin:0 4px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.row{display:flex;align-items:center;gap:20px;padding:14px 20px;min-height:64px;position:relative}
.card .row+.row{border-top:1px solid var(--border)}
.row.off{opacity:.4;pointer-events:none}
.row:has(.pop){z-index:6}
.lbl{flex:1;min-width:0}
.t{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.d{font-size:13px;color:var(--muted);margin-top:2px}
.crumb{font-size:12px;color:var(--accent);margin-bottom:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.reset{opacity:0;color:var(--muted);font-size:12px;transition:opacity .15s}
.row:hover .reset{opacity:1}
.reset:hover{color:var(--text)}
.ctl{display:flex;align-items:center;gap:10px;flex:none}
.sw{width:44px;height:26px;border-radius:999px;background:#3a3a40;position:relative;transition:background .2s;flex:none;display:block}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.dd{position:relative}
.ddb{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:180px;height:36px;padding:0 10px 0 14px;border-radius:10px;background:var(--raised);border:1px solid var(--border)}
.ddb:hover{border-color:var(--border2)}
.pop{position:absolute;right:0;top:calc(100% + 6px);min-width:100%;background:#1f1f23;border:1px solid var(--border2);border-radius:12px;padding:6px;z-index:5;box-shadow:0 20px 50px #000b;animation:fade .12s}
.pop button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;white-space:nowrap}
.pop button:hover{background:var(--hi)}
.pop .ck{width:16px;display:flex;color:var(--accent)}
.seg{display:flex;background:var(--raised);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 14px;border-radius:999px;color:var(--text2);font-size:13px}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:#000;font-weight:600}
.sl{display:flex;align-items:center;gap:12px}
.sl span{min-width:44px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
input[type=range]{appearance:none;width:200px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),#3a3a40 var(--p));outline:0}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0008}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.sws{display:flex;gap:10px}
.swc{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #fff2;transition:box-shadow .15s}
.swc.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #fff}
.pill{height:36px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill.white{background:#fff;color:#000}
.pill.white:hover{background:#e6e6e6}
.pill.ghost{background:#ffffff1a;color:#fff}
.pill.ghost:hover{background:#ffffff26}
.pill.danger{background:#f871711f;color:var(--danger)}
.pill.sm{height:26px;padding:0 12px;font-size:12px}
.inp{height:36px;width:230px;padding:0 12px;border-radius:10px;background:var(--raised);border:1px solid var(--border);outline:0;font-family:ui-monospace,monospace;font-size:13px}
.inp:focus{border-color:var(--accent)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.chip.ok{background:#4ade801f;color:var(--ok)}
.chip.no{background:#ffffff14;color:var(--muted)}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.lead{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
kbd{font:600 12px ui-monospace,monospace;padding:4px 8px;border-radius:6px;background:var(--raised);border:1px solid var(--border2);border-bottom-width:2px}
.muted{color:var(--muted)}
.chev{color:var(--muted);display:flex}
.empty{padding:80px 0;text-align:center;color:var(--muted)}

.pvwrap{margin-top:24px}
.pvwrap h2{font-size:13px;font-weight:600;color:var(--text2);margin:0 4px 10px;display:flex;justify-content:space-between}
.pv{border-radius:16px;border:1px solid var(--border);overflow:hidden;background:#09090b;display:flex;font-size:calc(11px * var(--s))}
.pv.top{flex-direction:column}
.pv-nav{display:flex;align-items:center;gap:6px;padding:10px 14px;flex:none}
.pv.side-nav .pv-nav{flex-direction:column;padding:14px 8px;border-right:1px solid var(--border);gap:8px}
.pv-nav i{display:flex;align-items:center;gap:6px;font-style:normal;color:var(--muted);padding:5px 10px;border-radius:999px}
.pv-nav i.on{background:#fff;color:#000;font-weight:600}
.pv-body{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pv-hero{flex:none;padding:14px 18px 12px;background:linear-gradient(90deg,#09090b 25%,#09090b00 70%),linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#000),#1b1030 60%,#03030a);}
.pv-logo{font:800 calc(22px * var(--s))/1 ui-sans-serif,system-ui;letter-spacing:.08em}
.pv-meta{color:#ffffffb0;margin:6px 0 10px}
.pv-btns{display:flex;gap:6px}
.pv-btns span{padding:5px 12px;border-radius:999px;font-weight:600}
.pv-btns .w{background:#fff;color:#000}
.pv-btns .g{background:#ffffff26}
.pv-row{display:flex;gap:var(--gap);padding:12px 18px;overflow:hidden}
.pv-card{flex:none;width:var(--pw)}
.pv-art{border-radius:var(--r);aspect-ratio:2/3;background:var(--g);box-shadow:inset 0 0 0 1px #ffffff14;transition:border-radius .2s,width .2s}
.pv.land .pv-card{width:calc(var(--pw) * 1.7)}
.pv.land .pv-art{aspect-ratio:16/9}
.pv-card b{display:block;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}

#frame[data-ff=phone] .p-top{padding:58px 20px 6px}
.p-top h1{font-size:32px;font-weight:700}
.p-bar{display:flex;align-items:center;gap:6px;padding:52px 8px 6px;flex:none}
.p-bar h2{font-size:22px;font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:#ffffff14}
.p-scroll{flex:1;overflow:auto;padding:0 0 120px;scrollbar-width:none}
.p-acct{margin:10px 16px 12px;padding:16px;border-radius:24px;background:var(--surface);display:flex;gap:14px;align-items:center;width:calc(100% - 32px);text-align:left}
.p-acct .av{width:52px;height:52px;font-size:20px}
.p-acct .n{font-size:18px;font-weight:600}
.p-acct .s{color:var(--muted);font-size:13px}
.p-search{margin:0 16px 8px;height:48px}
.pc{display:flex;align-items:center;gap:16px;padding:10px 20px;width:100%;text-align:left;min-height:68px}
.pc:active{background:#ffffff0d}
.ico{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.pc .t{font-size:16px;font-weight:500}
.pgrp h3{font-size:14px;font-weight:600;color:var(--accent);padding:22px 20px 4px}
#frame[data-ff=phone] .row{padding:12px 20px;min-height:72px;cursor:pointer;gap:16px}
#frame[data-ff=phone] .row:active{background:#ffffff0d}
#frame[data-ff=phone] .t{font-size:16px;font-weight:400}
#frame[data-ff=phone] .d{font-size:14px}
#frame[data-ff=phone] .row.wrap{flex-wrap:wrap;row-gap:4px}
#frame[data-ff=phone] .under{flex-basis:100%;display:flex;align-items:center;gap:12px}
#frame[data-ff=phone] .under input{flex:1;width:auto}
#frame[data-ff=phone] .ctl{pointer-events:none}
#frame[data-ff=phone] .pvwrap{margin:8px 16px 0}
.bnav{position:absolute;left:16px;right:16px;bottom:22px;height:64px;border-radius:999px;background:#1a1a1de6;backdrop-filter:blur(20px);border:1px solid var(--border);display:flex;align-items:center;padding:6px;gap:4px;z-index:4}
.bnav span{flex:1;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.bnav span.on{flex:2;background:#fff;color:#000}

.scrim{position:absolute;inset:0;background:#000b;z-index:10;animation:fade .2s}
.sheet{position:absolute;z-index:11;background:#1b1b1e;border:1px solid var(--border)}
#frame[data-ff=phone] .sheet{left:0;right:0;bottom:0;border-radius:28px 28px 0 0;padding:12px 8px 34px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
#frame:not([data-ff=phone]) .sheet{left:50%;top:50%;translate:-50% -50%;width:560px;border-radius:24px;padding:28px 20px;animation:pop .2s}
.handle{width:32px;height:4px;border-radius:4px;background:#ffffff40;margin:4px auto 18px}
.sheet h3{font-size:20px;font-weight:600;padding:0 16px 4px}
.sheet p{color:var(--muted);padding:0 16px 14px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;border-radius:14px;text-align:left;font-size:16px}
.opt:active{background:#ffffff0d}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--text2);position:relative;flex:none}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.sheet .inp{width:calc(100% - 32px);margin:0 16px;height:52px;font-size:15px}
.acts{display:flex;justify-content:flex-end;gap:8px;padding:18px 16px 0}
.qr{width:190px;height:190px;background:#fff;border-radius:14px;padding:12px;margin:8px auto 16px;display:block}
.code{font:700 34px ui-monospace,monospace;letter-spacing:.18em;text-align:center;color:var(--text)}

#frame[data-ff=tv] .side{width:400px;padding:36px 24px 36px 64px;gap:22px;background:linear-gradient(90deg,#111114,#0a0a0c)}
#frame[data-ff=tv] .acct .n{font-size:20px}
#frame[data-ff=tv] .acct .s{font-size:15px}
#frame[data-ff=tv] .av{width:52px;height:52px;font-size:20px}
#frame[data-ff=tv] .nav{gap:6px;padding:6px 10px;margin:0 -10px}
#frame[data-ff=tv] .ni{min-height:58px;font-size:20px;padding:0 20px;border-radius:14px;transition:transform .15s,background .15s}
#frame[data-ff=tv] .main{padding:36px 64px 36px 44px}
#frame[data-ff=tv] .col{max-width:none}
#frame[data-ff=tv] .ph h1{font-size:36px}
#frame[data-ff=tv] .ph p{font-size:18px}
#frame[data-ff=tv] .grp h2{font-size:17px;color:var(--muted)}
#frame[data-ff=tv] .card{background:none;border:0;display:flex;flex-direction:column;gap:8px}
#frame[data-ff=tv] .row{min-height:78px;padding:14px 26px;border-radius:16px;background:var(--surface);transition:transform .15s,background .15s,box-shadow .15s}
#frame[data-ff=tv] .t{font-size:21px}
#frame[data-ff=tv] .d{font-size:16px}
#frame[data-ff=tv] .side-foot{font-size:15px}
.f:focus{outline:none}
#frame[data-ff=tv] .f.cur{background:#fff;color:#000;transform:scale(1.03);box-shadow:0 14px 40px #000a}
#frame[data-ff=tv] .f.cur .d,#frame[data-ff=tv] .f.cur .muted,#frame[data-ff=tv] .f.cur .chev{color:#555}
#frame[data-ff=tv] .f.cur .sw:not(.on){background:#c4c4c8}
#frame[data-ff=tv] .f.cur .radio{border-color:#000}
#frame[data-ff=tv] .f.cur .chip.no{background:#0000001a;color:#444}
#frame[data-ff=tv] .ni.on:not(.cur){background:var(--raised)}
#frame[data-ff=tv] .sheet{width:620px;padding:34px 24px}
#frame[data-ff=tv] .sheet h3{font-size:26px}
#frame[data-ff=tv] .sheet p{font-size:17px}
#frame[data-ff=tv] .opt{font-size:20px;padding:16px 20px}
.cyc{display:flex;align-items:center;gap:14px;font-size:19px}
.cyc b{font-weight:600;display:flex;align-items:center;gap:8px}
.cyc .ar{opacity:.45;display:flex}
.cyc i{width:14px;height:14px;border-radius:50%;background:var(--c)}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;scale:.96}}
</style>
</head>
<body>
<div class="demo" id="demo">
  <b>Fluxa · Settings</b>
  <div class="seg" id="ffs">
    <button data-ff="desktop" class="on">Desktop</button>
    <button data-ff="phone">Phone</button>
    <button data-ff="tv">TV</button>
  </div>
  <span class="hint" id="hint"></span>
</div>
<div id="stage"><div id="frame"></div></div>
<script>
const ICON = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  play: '<path d="M7 4.5v15l12-7.5z"/>',
  captions: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 12h3M13 12h4M7 15h6M15 15h2"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  blocks: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  remote: '<rect x="7" y="2" width="10" height="20" rx="5"/><circle cx="12" cy="8" r="2"/><path d="M12 14h.01M12 17h.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  right: '<path d="m9 6 6 6-6 6"/>',
  left: '<path d="m15 6-6 6 6 6"/>',
  back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  library: '<path d="M5 4v16M10 4v16M14.5 5l5 14.5"/>',
};
const ic = (n, s = 20) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const ACCENTS = [['Violet', '#8B5CF6'], ['Blue', '#3B82F6'], ['Teal', '#14B8A6'], ['Rose', '#F43F5E'], ['Amber', '#F59E0B'], ['Lime', '#84CC16']];
const ALL = ['desktop', 'phone', 'tv'];

const CATS = [
  { id: 'account', icon: 'user', title: 'Account', desc: 'Profile, tracking and sync', groups: [
    { title: 'Profile', rows: [
      { k: 'profile', t: 'link', label: 'Switch profile', value: 'Alex' },
      { k: 'avatar', t: 'link', label: 'Avatar', desc: 'Synced from your Nuvio account' },
    ] },
    { title: 'Tracking', rows: [
      { k: 'svc_simkl', t: 'service', label: 'Simkl', logo: ['S', '#0B0F10'], user: 'alex_w', v: true },
      { k: 'svc_trakt', t: 'service', label: 'Trakt', logo: ['T', '#ED1C24'], user: 'alexw', v: false },
      { k: 'svc_mdblist', t: 'service', label: 'MDBList', logo: ['M', '#2E6BE6'], user: 'alex', v: false },
      { k: 'svc_anilist', t: 'service', label: 'AniList', logo: ['A', '#02A9FF'], user: 'alexw', v: true },
      { k: 'svc_mal', t: 'service', label: 'MyAnimeList', logo: ['MAL', '#2E51A2'], user: 'alex_w', v: false },
    ] },
    { title: 'Session', rows: [
      { k: 'signout', t: 'action', label: 'Sign out', desc: 'Signed in to Nuvio as Alex', btn: 'Sign out', danger: true },
    ] },
  ] },
  { id: 'general', icon: 'sliders', title: 'General', desc: 'Language, startup and behavior', groups: [
    { title: 'Language and startup', rows: [
      { k: 'language', t: 'select', label: 'Language', opts: ['English', 'Türkçe', 'العربية', 'עברית'], v: 'English' },
      { k: 'startPage', t: 'select', label: 'Start page', opts: ['Home', 'Discover', 'Library', 'Calendar'], v: 'Home' },

const ROWS = {};
const DEF = {};
for (const c of CATS) for (const g of c.groups) for (const r of g.rows) {
  ROWS[r.k] = r;
  if ('v' in r) DEF[r.k] = r.v;
}

const S = { ff: 'desktop', cat: 'appearance', q: '', v: { ...DEF }, pop: null, sheet: null, fid: null, small: false };
const $ = s => document.querySelector(s);
const frame = $('#frame');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const on = (x) => !x.only || x.only.includes(S.ff);
const catTitle = c => c.titles?.[S.ff] ?? c.title;
const catDesc = c => c.descs?.[S.ff] ?? c.desc;
const catIcon = c => c.icons?.[S.ff] ?? c.icon;
const visGroups = c => c.groups.filter(on).map(g => ({ ...g, rows: g.rows.filter(on) })).filter(g => g.rows.length);
const visCats = () => CATS.filter(c => on(c) && visGroups(c).length);
const disabled = r => r.dep && !S.v[r.dep];
const modified = r => r.k in DEF && S.v[r.k] !== DEF[r.k] && !['service', 'addon', 'key'].includes(r.t);
const shown = r => r.t === 'swatch' ? ACCENTS.find(a => a[1] === S.v[r.k])[0] : r.t === 'slider' ? S.v[r.k] + r.unit : S.v[r.k];
const pct = r => ((S.v[r.k] - r.min) / (r.max - r.min) * 100) + '%';
const cycles = r => ['select', 'seg', 'swatch', 'slider'].includes(r.t);

function control(r) {
  const v = S.v[r.k];
  const sw = `<span class="sw ${v ? 'on' : ''}"></span>`;
  if (S.ff === 'tv') {
    if (r.t === 'toggle' || r.t === 'addon') return sw;
    if (cycles(r)) {
      const dot = r.t === 'swatch' ? `<i style="--c:${v}"></i>` : '';
      return `<span class="cyc"><span class="ar">${ic('left', 18)}</span><b>${dot}${esc(shown(r))}</b><span class="ar">${ic('right', 18)}</span></span>`;
    }
    if (r.t === 'key') return `<span class="chip ${v ? 'ok' : 'no'}">${v ? 'Valid' : 'Not set'}</span><span class="chev">${ic('right')}</span>`;
    if (r.t === 'service') return `<span class="chip ${v ? 'ok' : 'no'}">${v ? 'Connected' : 'Connect'}</span>`;
    if (r.t === 'info') return `<span class="muted">${r.value}</span>`;
    return `<span class="muted">${r.value ?? ''}</span><span class="chev">${ic('right')}</span>`;
  }
  if (S.ff === 'phone') {
    if (r.t === 'toggle' || r.t === 'addon') return sw;
    if (r.t === 'swatch') return `<span class="swc" style="--c:${v}"></span>`;
    if (r.t === 'service') return `<span class="pill sm ${v ? 'ghost' : 'white'}">${v ? 'Disconnect' : 'Connect'}</span>`;
    if (r.t === 'action') return `<span class="pill sm ${r.danger ? 'danger' : 'ghost'}">${r.btn}</span>`;
    if (r.t === 'link') return `<span class="chev">${ic('right')}</span>`;
    return '';
  }
  switch (r.t) {
    case 'toggle':
    case 'addon':
      return `${r.t === 'addon' ? `<button class="pill sm ghost">Configure</button>` : ''}<button class="sw ${v ? 'on' : ''}" data-act="toggle" data-k="${r.k}" aria-pressed="${!!v}" aria-label="${esc(r.label)}"></button>`;
    case 'select':
      return `<div class="dd"><button class="ddb" data-act="pop" data-k="${r.k}"><span>${esc(v)}</span>${ic('down', 16)}</button>${S.pop === r.k ? `<div class="pop">${r.opts.map(o => `<button data-act="set" data-k="${r.k}" data-v="${esc(o)}"><span class="ck">${o === v ? ic('check', 16) : ''}</span>${esc(o)}</button>`).join('')}</div>` : ''}</div>`;
    case 'seg':
      return `<div class="seg">${r.opts.map(o => `<button class="${o === v ? 'on' : ''}" data-act="set" data-k="${r.k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    case 'slider':
      return `<div class="sl"><input type="range" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="--p:${pct(r)}"><span>${shown(r)}</span></div>`;
    case 'swatch':
      return `<div class="sws">${r.opts.map(([n, c]) => `<button class="swc ${c === v ? 'on' : ''}" style="--c:${c}" title="${n}" data-act="set" data-k="${r.k}" data-v="${c}"></button>`).join('')}</div>`;
    case 'key':
      return `<span class="chip ${v ? 'ok' : 'no'}">${v ? 'Valid' : 'Not set'}</span><input class="inp" type="password" data-k="${r.k}" value="${esc(v)}" placeholder="Paste key" spellcheck="false">`;
    case 'service':
      return `${v ? `<span class="muted">@${r.user}</span>` : ''}<button class="pill ${v ? 'ghost' : 'white'}" data-act="toggle" data-k="${r.k}">${v ? 'Disconnect' : 'Connect'}</button>`;
    case 'action':
      return `<button class="pill ${r.danger ? 'danger' : 'ghost'}">${r.btn}</button>`;
    case 'shortcut':
      return r.keys.map(k => `<kbd>${k}</kbd>`).join('');
    case 'info':
      return `<span class="muted">${r.value}</span>`;
    default:
      return `<span class="muted">${r.value ?? ''}</span><span class="chev">${ic('right')}</span>`;
  }
}

function row(r, crumb) {
  const v = S.v[r.k];
  const mod = modified(r);
  let sub = r.desc;
  if (S.ff === 'phone') {
    if (['select', 'seg', 'swatch'].includes(r.t)) sub = shown(r);
    if (r.t === 'slider') sub = null;
    if (r.t === 'key') sub = v ? 'Valid key saved' : 'Not set';
    if (r.t === 'service') sub = v ? `Signed in as @${r.user}` : 'Not connected';
    if (r.t === 'link' && r.value) sub = r.value;
    if (r.t === 'info') sub = r.value;
  }
  if (r.t === 'addon') sub = r.meta;
  const lead = r.logo ? `<span class="logo" style="background:${r.logo[1]}">${r.logo[0]}</span>` : '';
  const reset = mod && S.ff === 'desktop' ? `<button class="reset" data-act="reset" data-k="${r.k}">Reset</button>` : '';
  const tvAct = S.ff !== 'desktop';
  const under = S.ff === 'phone' && r.t === 'slider'
    ? `<div class="under"><input type="range" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="--p:${pct(r)}"><span class="muted">${shown(r)}</span></div>` : '';
  return `<div class="row ${disabled(r) ? 'off' : ''} ${under ? 'wrap' : ''} ${tvAct ? 'f' : ''}" ${tvAct ? `tabindex="-1" data-act="row"` : ''} data-k="${r.k}" data-fid="row:${r.k}">
    <div class="lead">${lead}<div class="lbl">${crumb ? `<div class="crumb">${crumb}</div>` : ''}<div class="t">${mod ? '<i class="dot"></i>' : ''}${esc(r.label)}${reset}</div>${sub ? `<div class="d">${esc(sub)}</div>` : ''}</div></div>
    <div class="ctl">${control(r)}</div>${under}
  </div>`;
}

const POSTERS = [['Nightfall', 330], ['Glass Harbor', 200], ['The Long Field', 30], ['Ember', 10], ['Static Bloom', 160], ['Low Orbit', 260], ['Saltwater', 190], ['Paper Moons', 300]];

function preview() {
  const v = S.v;
  const r = { Sharp: 3, Soft: 9, Round: 16 }[v.corners];
  const pw = { Compact: 54, Standard: 66, Large: 80 }[v.posterWidth];
  const gap = { Compact: 6, Comfortable: 10, Spacious: 14 }[v.density];
  const side = v.navLayout === 'Sidebar' && S.ff !== 'phone';
  const nav = [['home', 'Home'], ['compass', 'Discover'], ['library', 'Library']]
    .map(([i, n], x) => `<i class="${x === 0 ? 'on' : ''}">${ic(i, 13)}${v.navLabels && !side ? n : ''}</i>`).join('');
  const cards = POSTERS.map(([n, h]) => `<div class="pv-card"><div class="pv-art" style="--g:linear-gradient(160deg,hsl(${h} 55% 42%),hsl(${h + 40} 60% 14%))"></div>${v.hideTitles ? '' : `<b>${n}</b>`}</div>`).join('');
  return `<section class="pvwrap" id="pv"><h2><span>Live preview</span><span class="muted">${S.ff === 'phone' ? '' : 'Updates as you change settings'}</span></h2>
    <div class="pv ${side ? 'side-nav' : 'top'} ${v.landscape ? 'land' : ''}" style="--r:${r}px;--pw:${pw * v.uiScale / 100}px;--gap:${gap}px;--s:${v.uiScale / 100}">
      <div class="pv-nav">${nav}</div>
      <div class="pv-body">
        <div class="pv-hero"><div class="pv-logo">NIGHTFALL</div><div class="pv-meta">2026 · Sci-fi · 2h 14m${v.heroRatings ? ' · ★ 8.1' : ''}</div><div class="pv-btns"><span class="w">Play</span><span class="g">Watchlist</span></div></div>
        <div class="pv-row">${cards}</div>
      </div>
    </div></section>`;
}

function groups(c) {
  return visGroups(c).map(g => S.ff === 'phone'
    ? `<section class="pgrp"><h3>${g.title}</h3>${g.rows.map(r => row(r)).join('')}</section>`
    : `<section class="grp"><h2>${g.title}</h2><div class="card">${g.rows.map(r => row(r)).join('')}</div></section>`).join('');
}

function results() {
  const q = S.q.trim().toLowerCase();
  const hits = [];
  for (const c of visCats()) for (const g of visGroups(c)) for (const r of g.rows)
    if ((r.label + ' ' + (r.desc ?? '') + ' ' + g.title).toLowerCase().includes(q)) hits.push(row(r, `${catTitle(c)} › ${g.title}`));
  if (!hits.length) return `<div class="empty">No settings match “${esc(S.q)}”</div>`;
  return S.ff === 'phone' ? `<section class="pgrp">${hits.join('')}</section>` : `<section class="grp"><h2>${hits.length} results</h2><div class="card">${hits.join('')}</div></section>`;
}

function acct(cls) {
  return `<button class="${cls}" ${S.ff === 'tv' ? 'tabindex="-1"' : ''}><span class="av">A</span><span><div class="n">Alex</div><div class="s">Nuvio account · Switch profile</div></span></button>`;
}

function sheet() {
  if (!S.sheet) return '';
  const r = ROWS[S.sheet];
  let body;
  if (r.t === 'key' && S.ff === 'tv') {
    body = `<h3>${r.label}</h3><p>Scan with your phone and paste the key there. It appears here as soon as you save it.</p>${qr()}<div class="code">KX7 · 42P</div>
      <div class="acts"><button class="pill ghost f" tabindex="-1" data-act="close" data-fid="opt:close">Cancel</button></div>`;
  } else if (r.t === 'key') {
    body = `<h3>${r.label}</h3><p>${r.desc ?? 'Paste the key from the service dashboard.'}</p><input class="inp" id="sheetkey" type="text" value="${esc(S.v[r.k])}" placeholder="Paste key" spellcheck="false">
      <div class="acts"><button class="pill ghost" data-act="close">Cancel</button><button class="pill white" data-act="savekey" data-k="${r.k}">Save</button></div>`;
  } else if (r.t === 'service') {
    body = `<h3>Connect ${r.label}</h3><p>On your phone or computer, open fluxa.link/${r.label.toLowerCase()} and enter this code.</p>${qr()}<div class="code">QF4 · 9ZM</div>
      <div class="acts"><button class="pill ghost f" tabindex="-1" data-act="close" data-fid="opt:close">Cancel</button></div>`;
  } else {
    const opts = r.t === 'swatch' ? r.opts : r.opts.map(o => [o, o]);
    body = `${S.ff === 'phone' ? '<div class="handle"></div>' : ''}<h3>${r.label}</h3>${opts.map(([n, val]) =>
      `<button class="opt f" tabindex="-1" data-act="pick" data-k="${r.k}" data-v="${esc(val)}" data-fid="opt:${esc(val)}"><span class="radio ${S.v[r.k] === val ? 'on' : ''}"></span>${r.t === 'swatch' ? `<span class="swc" style="--c:${val};width:20px;height:20px"></span>` : ''}${esc(n)}</button>`).join('')}`;
  }
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog">${body}</div>`;
}

function qr() {
  let cells = '';
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#000" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
    if (!inFinder && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="-.5 -.5 26 26" shape-rendering="crispEdges">${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}${cells}</svg>`;
}

function render() {
  const active = document.activeElement;
  const keepSearch = active && active.id === 'q' ? active.selectionStart : null;
  document.documentElement.style.setProperty('--accent', S.v.accent);
  frame.dataset.ff = S.ff;
  const cats = visCats();
  if (S.cat && !cats.find(c => c.id === S.cat)) S.cat = S.ff === 'phone' ? null : cats[0].id;
  if (!S.cat && S.ff !== 'phone') S.cat = cats[0].id;
  const c = CATS.find(x => x.id === S.cat);

  if (S.ff === 'phone') {
    if (!c) {
      frame.innerHTML = `<div class="p-top"><h1>Settings</h1></div><div class="p-scroll">${acct('p-acct')}
        <label class="search p-search">${ic('search', 18)}<input id="q" type="search" placeholder="Search settings" value="${esc(S.q)}" autocomplete="off"></label>
        ${S.q ? results() : cats.map(x => `<button class="pc" data-act="cat" data-cat="${x.id}"><span class="ico">${ic(catIcon(x))}</span><span class="lbl"><div class="t">${catTitle(x)}</div><div class="d">${catDesc(x)}</div></span></button>`).join('')}
      </div><div class="bnav"><span>${ic('home')}</span><span>${ic('compass')}</span><span>${ic('library')}</span><span class="on">${ic('sliders')}Settings</span></div>${sheet()}`;
    } else {
      frame.innerHTML = `<div class="p-bar"><button class="ib" data-act="back" aria-label="Back">${ic('back', 22)}</button><h2>${catTitle(c)}</h2></div>
        <div class="p-scroll">${c.preview ? preview() : ''}${groups(c)}</div>${sheet()}`;
    }
  } else {
    const tv = S.ff === 'tv';
    frame.innerHTML = `<aside class="side">${acct('acct')}
      ${tv ? '' : `<label class="search">${ic('search', 16)}<input id="q" type="search" placeholder="Find a setting" value="${esc(S.q)}" autocomplete="off"></label>`}
      <nav class="nav">${cats.map(x => `<button class="ni f ${x.id === S.cat && !S.q ? 'on' : ''}" ${tv ? 'tabindex="-1"' : ''} data-act="cat" data-cat="${x.id}" data-fid="nav:${x.id}">${ic(catIcon(x), tv ? 24 : 18)}<span>${catTitle(x)}</span></button>`).join('')}</nav>
      <div class="side-foot"><span>Fluxa 0.42</span><span>${tv ? '' : 'Ctrl + ,'}</span></div></aside>
      <main class="main" id="main"><div class="col">${S.q ? `<header class="ph"><h1>Search</h1><p>Settings matching “${esc(S.q)}”</p></header>${results()}`
        : `<header class="ph"><h1>${catTitle(c)}</h1><p>${catDesc(c)}</p></header>${c.preview && !tv ? preview() : ''}${groups(c)}`}</div></main>${sheet()}`;
  }

  if (keepSearch !== null) {
    const q = $('#q');
    q.focus();
    q.setSelectionRange(keepSearch, keepSearch);
  }
  if (S.ff === 'tv') {
    const el = (S.fid && frame.querySelector(`[data-fid="${CSS.escape(S.fid)}"]`)) || frame.querySelector(S.sheet ? '.sheet .f' : '.ni.on');
    if (el) { el.classList.add('cur'); el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); }
  }
  if (S.sheet && S.ff !== 'tv') $('#sheetkey')?.focus();
}

function set(k, v) {
  S.v[k] = v;
}

function rowAct(r) {
  if (r.t === 'toggle' || r.t === 'addon') return set(r.k, !S.v[r.k]);
  if (['select', 'seg', 'swatch', 'key'].includes(r.t)) {
    S.sheet = r.k;
    S.fid = r.t === 'key' ? 'opt:close' : 'opt:' + S.v[r.k];
    return;
  }
  if (r.t === 'service') {
    if (S.ff === 'tv' && !S.v[r.k]) { S.sheet = r.k; S.fid = 'opt:close'; }
    else set(r.k, !S.v[r.k]);
  }
}

function closeSheet() {
  if (S.sheet) S.fid = 'row:' + S.sheet;
  S.sheet = null;
}

frame.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.pop) { S.pop = null; render(); }
    return;
  }
  const k = el.dataset.k;
  const r = ROWS[k];
  switch (el.dataset.act) {
    case 'cat':
      S.cat = el.dataset.cat; S.q = ''; S.pop = null;
      if (S.ff === 'tv') S.fid = 'nav:' + S.cat;
      frame.querySelector('.main, .p-scroll')?.scrollTo(0, 0);
      break;
    case 'back': S.cat = null; break;
    case 'toggle': set(k, !S.v[k]); break;
    case 'pop': S.pop = S.pop === k ? null : k; break;
    case 'set': set(k, el.dataset.v); S.pop = null; break;
    case 'reset': set(k, DEF[k]); break;
    case 'row': if (!disabled(r)) rowAct(r); break;
    case 'pick': set(k, el.dataset.v); closeSheet(); break;
    case 'savekey': set(k, $('#sheetkey').value.trim()); closeSheet(); break;
    case 'close': closeSheet(); break;
    default: return;
  }
  render();
});

frame.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; S.pop = null; render(); return; }
  if (el.type === 'range') {
    const r = ROWS[el.dataset.k];
    set(r.k, Number(el.value));
    el.style.setProperty('--p', pct(r));
    el.nextElementSibling.textContent = shown(r);
    const pv = $('#pv');
    if (pv) pv.outerHTML = preview();
  }
  if (el.classList.contains('inp') && el.dataset.k) S.v[el.dataset.k] = el.value.trim();
});
frame.addEventListener('change', e => {
  if (e.target.type === 'range' || (e.target.classList.contains('inp') && e.target.dataset.k)) render();
});

function cycle(r, dir) {
  if (r.t === 'slider') set(r.k, Math.min(r.max, Math.max(r.min, S.v[r.k] + dir * r.step)));
  else {
    const vals = r.t === 'swatch' ? r.opts.map(o => o[1]) : r.opts;
    const i = vals.indexOf(S.v[r.k]);
    set(r.k, vals[(i + dir + vals.length) % vals.length]);
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); return; }
  const back = e.key === 'Escape' || (e.key === 'Backspace' && !/INPUT/.test(document.activeElement?.tagName));
  if (S.ff !== 'tv') {
    if (!back) return;
    if (S.sheet) closeSheet();
    else if (S.pop) S.pop = null;
    else if (S.ff === 'phone' && S.cat) S.cat = null;
    else if (S.q) S.q = '';
    else return;
    e.preventDefault();
    render();
    return;
  }
  const cur = document.activeElement?.closest('.f');
  const inRail = !!cur?.closest('.side');
  const zone = S.sheet ? '.sheet' : inRail ? '.side' : '.main';
  const list = [...frame.querySelectorAll(zone + ' .f:not(.off)')];
  const i = list.indexOf(cur);
  const r = cur?.dataset.k && ROWS[cur.dataset.k];
  const go = el => { if (!el) return; S.fid = el.dataset.fid; if (inRail && !S.sheet) S.cat = el.dataset.cat; render(); };
  if (e.key === 'ArrowDown') go(list[Math.min(list.length - 1, i + 1)] ?? list[0]);
  else if (e.key === 'ArrowUp') go(list[Math.max(0, i - 1)] ?? list[0]);
  else if (e.key === 'ArrowRight' && !S.sheet) {
    if (inRail) { const first = frame.querySelector('.main .f:not(.off)'); if (first) { S.fid = first.dataset.fid; render(); } }
    else if (r && cycles(r)) { cycle(r, 1); render(); }
  } else if (e.key === 'ArrowLeft' && !S.sheet) {
    if (r && cycles(r) && !inRail) { cycle(r, -1); render(); }
    else if (!inRail) { S.fid = 'nav:' + S.cat; render(); }
  } else if (e.key === 'Enter' || e.key === ' ') cur?.click();
  else if (back) {
    if (S.sheet) closeSheet();
    else if (!inRail) S.fid = 'nav:' + S.cat;
    render();
  } else return;
  e.preventDefault();
});

const HINTS = {
  desktop: 'Sidebar + one column of cards · search, live preview, Reset on changed rows',
  phone: 'Material 3 lists · value as supporting text · bottom sheets · Esc = system back',
  tv: 'D-pad: ↑ ↓ move · ← → change value · Enter opens · Esc goes back one level',
};

function setFF(ff) {
  S.ff = ff;
  S.pop = null; S.sheet = null; S.q = '';
  S.cat = ff === 'phone' ? null : S.cat || 'appearance';
  S.fid = ff === 'tv' ? 'nav:' + (S.cat || 'appearance') : null;
  document.querySelectorAll('#ffs button').forEach(b => b.classList.toggle('on', b.dataset.ff === ff));
  $('#hint').textContent = HINTS[ff];
  fit();
  render();
}

function fit() {
  const st = $('#stage');
  const wasSmall = S.small;
  S.small = innerWidth < 700;
  $('#demo').style.display = S.small ? 'none' : '';
  if (wasSmall && !S.small) S.ff = $('#ffs .on').dataset.ff;
  const W = st.clientWidth, H = st.clientHeight;
  frame.classList.toggle('fill', S.small);
  if (S.small) {
    if (S.ff !== 'phone') { S.ff = 'phone'; S.cat = null; }
    Object.assign(frame.style, { width: W + 'px', height: H + 'px', transform: '' });
    return;
  }
  const [w, h] = { desktop: [Math.min(W - 48, 1440), H - 48], phone: [390, 844], tv: [1280, 720] }[S.ff];
  const sc = S.ff === 'desktop' ? 1 : Math.min((W - 56) / w, (H - 56) / h, 1);
  frame.classList.toggle('boxed', S.ff === 'desktop');
  Object.assign(frame.style, { width: w + 'px', height: h + 'px', transform: `scale(${sc})` });
}

$('#ffs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFF(b.dataset.ff); });
addEventListener('resize', () => { const was = S.ff; fit(); if (S.ff !== was) setFF(S.ff); });
setFF('desktop');
</script>
</body>
